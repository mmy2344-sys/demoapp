/* =====================================================================
   Design system — mobile first. Base styles target a ~375px phone;
   @media (min-width: …) layers add room for tablets and desktops.
   ===================================================================== */
:root{
  --ground:#F3F5F7; --surface:#FFFFFF; --surface-2:#F5F7F9; --surface-3:#E8ECEF;
  --line:#E3E8EC; --line-2:#CFD7DD;
  --ink:#0E1B24; --ink-2:#44545E; --ink-3:#6F7F89;
  --brand:#16324B; --brand-ink:#FFFFFF; --brand-soft:#E7EEF5; --brand-text:#16324B;
  --accent:#2563D9; --accent-soft:#E5EDFC;
  --ok:#15804D; --ok-soft:#E1F3E9; --retry:#B0650A; --retry-soft:#FCEED8; --fail:#BF3530; --fail-soft:#FBE3E1;
  --pend:#5C6C76; --pend-soft:#EBEFF2;
  --shadow-1:0 1px 2px rgba(14,27,36,.05); --shadow-2:0 2px 6px rgba(14,27,36,.05),0 10px 30px rgba(14,27,36,.07);
  --scrim:rgba(8,14,18,.48); --focus:rgba(37,99,217,.35);
  --map-bg:#E6EBE8; --map-grid:rgba(22,50,75,.06); --road:#FFFFFF; --road-edge:#CBD3CF; --map-label:#5E6E75; --area-label:#96A4AA;
  --r-sm:10px; --r-md:14px; --r-lg:18px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ground:#0B1217; --surface:#121C23; --surface-2:#172229; --surface-3:#1F2C35;
    --line:#223038; --line-2:#2E3E48;
    --ink:#E8EEF1; --ink-2:#A8B6BE; --ink-3:#7A8A93;
    --brand:#DCE7F2; --brand-ink:#0B1217; --brand-soft:#1B2A37; --brand-text:#C3D6EA;
    --accent:#6E9BF3; --accent-soft:#18263F;
    --ok:#3CC07E; --ok-soft:#133426; --retry:#E6A445; --retry-soft:#382912; --fail:#EF6C64; --fail-soft:#3C1C1A;
    --pend:#96A5AE; --pend-soft:#1D2A32;
    --shadow-1:0 1px 2px rgba(0,0,0,.3); --shadow-2:0 2px 6px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.3);
    --map-bg:#101A20; --map-grid:rgba(232,238,241,.045); --road:#26353E; --road-edge:#16222A; --map-label:#9AABB3; --area-label:#5B6D76;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#0B1217; --surface:#121C23; --surface-2:#172229; --surface-3:#1F2C35;
  --line:#223038; --line-2:#2E3E48;
  --ink:#E8EEF1; --ink-2:#A8B6BE; --ink-3:#7A8A93;
  --brand:#DCE7F2; --brand-ink:#0B1217; --brand-soft:#1B2A37; --brand-text:#C3D6EA;
  --accent:#6E9BF3; --accent-soft:#18263F;
  --ok:#3CC07E; --ok-soft:#133426; --retry:#E6A445; --retry-soft:#382912; --fail:#EF6C64; --fail-soft:#3C1C1A;
  --pend:#96A5AE; --pend-soft:#1D2A32;
  --shadow-1:0 1px 2px rgba(0,0,0,.3); --shadow-2:0 2px 6px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.3);
  --map-bg:#101A20; --map-grid:rgba(232,238,241,.045); --road:#26353E; --road-edge:#16222A; --map-label:#9AABB3; --area-label:#5B6D76;
}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--ink);font-family:"Rubik",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;overflow-wrap:anywhere}
#root{height:100%}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0;touch-action:manipulation}
input,select,textarea{font:inherit;color:var(--ink)}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
svg{flex:none}
[hidden]{display:none!important}
.splash{height:100%;display:grid;place-items:center;color:var(--ink-3);background:var(--ground)}

/* ---------- status badges (shared) ---------- */
.sb{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px 0 8px;border-radius:14px;font-size:13px;font-weight:500;white-space:nowrap;flex:none}
.sb svg{width:15px;height:15px}
.sb.delivered{background:var(--ok-soft);color:var(--ok)}
.sb.pending{background:var(--pend-soft);color:var(--pend)}
.sb.retry{background:var(--retry-soft);color:var(--retry)}
.sb.failed{background:var(--fail-soft);color:var(--fail)}
.sb.icon-only{width:32px;height:32px;padding:0;justify-content:center;border-radius:50%}
.sb.icon-only svg{width:17px;height:17px}
.pill{display:inline-flex;align-items:center;height:26px;padding:0 10px;border-radius:13px;font-size:12.5px;font-weight:500;white-space:nowrap}
.pill.pending,.pill.draft,.pill.done{background:var(--pend-soft);color:var(--pend)}
.pill.delivered,.pill.finished{background:var(--ok-soft);color:var(--ok)}
.pill.retry,.pill.locating{background:var(--retry-soft);color:var(--retry)}
.pill.failed{background:var(--fail-soft);color:var(--fail)}
.pill.assigning,.pill.active{background:var(--accent-soft);color:var(--accent)}

/* ---------- map (shared) ---------- */
.lmap{position:relative;border-radius:var(--r-md);overflow:hidden;border:1px solid var(--line);min-height:220px;max-width:100%;isolation:isolate}
.lmap-inner{position:absolute;inset:0;background-color:var(--map-bg);background-image:linear-gradient(var(--map-grid) 1px,transparent 1px),linear-gradient(90deg,var(--map-grid) 1px,transparent 1px);background-size:32px 32px}
.lmap.placing .leaflet-grab,.lmap.placing .leaflet-container{cursor:crosshair}
.lmap-note{position:absolute;z-index:500;bottom:6px;inset-inline-end:6px;background:var(--surface);color:var(--ink-3);font-size:11px;padding:3px 8px;border-radius:8px;box-shadow:var(--shadow-1);pointer-events:none}
.lmap-hint{position:absolute;z-index:500;top:10px;inset-inline:12px;margin-inline:auto;width:max-content;max-width:calc(100% - 24px);background:var(--ink);color:var(--surface);font-size:13px;padding:8px 12px;border-radius:10px;box-shadow:var(--shadow-2);text-align:center;pointer-events:none}
.leaflet-container{background:transparent;font-family:inherit}
.leaflet-control-zoom a{width:36px!important;height:36px!important;line-height:36px!important;font-size:18px!important}
.leaflet-control-attribution{font-size:10px}
path.st-edge{stroke:var(--road-edge)} path.st-road{stroke:var(--road)}
.st-label{white-space:nowrap;font:500 11px "Rubik",sans-serif;color:var(--map-label);transform:translate(-50%,-50%);display:inline-block;text-shadow:0 0 3px var(--map-bg),0 0 3px var(--map-bg)}
.area-label{white-space:nowrap;font:600 11.5px "Rubik",sans-serif;color:var(--area-label);letter-spacing:.03em;transform:translate(-50%,-50%);display:inline-block}
.mk{width:100%;height:100%;border-radius:50%;display:grid;place-items:center;color:#fff;font:600 11px "Rubik",sans-serif;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35);box-sizing:border-box}
.mk.faint{opacity:.55;border-width:1.5px}
.mk.sel{border-color:#2563D9;border-width:3px;box-shadow:0 0 0 5px rgba(37,99,217,.3),0 2px 6px rgba(0,0,0,.4)}
.mk.ring{border-width:3px}
.mk.new{background:#2563D9!important;border-color:#fff;border-width:3px;box-shadow:0 0 0 6px rgba(37,99,217,.28),0 2px 8px rgba(0,0,0,.4)}
.pin{width:100%;height:100%;border-radius:50%;display:grid;place-items:center;font:600 13px "Rubik",sans-serif;color:#fff;border:2.5px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.35);background:#5C6C76;box-sizing:border-box}
.pin.delivered{background:#15804D}.pin.retry{background:#B0650A}.pin.failed{background:#BF3530}
.pin.current{font-size:16px;background:#16324B;border-color:#fff;border-width:3px;box-shadow:0 0 0 7px rgba(37,99,217,.35),0 3px 8px rgba(0,0,0,.4)}
.pin.me{background:#2563D9;border-width:3px;box-shadow:0 0 0 8px rgba(37,99,217,.18)}

/* =====================================================================
   COURIER
   ===================================================================== */
.c-app{height:100%;display:flex;flex-direction:column;background:var(--ground);max-width:640px;margin-inline:auto;position:relative;overflow:hidden}
@media (min-width:641px){.c-app{border-inline:1px solid var(--line)}}

/* header */
.c-head{background:var(--surface);border-bottom:1px solid var(--line);padding:10px 16px 14px;display:flex;flex-direction:column;gap:10px;flex:none}
.c-row{display:flex;align-items:center;gap:12px;min-width:0}
.c-title{flex:1;min-width:0}
.c-title b{display:block;font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c-title span{display:block;font-size:13px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c-icon{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:var(--ink-2);flex:none}
.c-icon:active{background:var(--surface-2)}
.c-icon svg{width:22px;height:22px}
.c-prog{flex:1;min-width:0;display:flex;align-items:baseline;gap:8px}
.c-prog b{font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1}
.c-prog span{font-size:14px;color:var(--ink-3)}
.c-bar{height:8px;border-radius:8px;background:var(--surface-3);display:flex;overflow:hidden}
.c-bar i{display:block;height:100%}
.seg{display:inline-grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface-3);border-radius:12px;padding:3px;gap:2px;flex:none}
.seg button{height:38px;padding:0 12px;border-radius:9px;font-size:14px;color:var(--ink-2);display:flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.seg button svg{width:17px;height:17px}
.seg button[aria-pressed="true"],.seg button[aria-selected="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:var(--shadow-1)}
.task-switch{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding-inline:16px}
.task-switch::-webkit-scrollbar{display:none}
.task-switch button{flex:none;height:34px;padding:0 12px;border-radius:17px;background:var(--surface-2);border:1px solid var(--line);font-size:13px;color:var(--ink-2)}
.task-switch button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}

/* body */
.c-body{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.c-pad{padding:16px;display:flex;flex-direction:column;gap:20px}
.next{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px 18px 16px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow-1)}
.next-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.eyebrow{font-size:13px;color:var(--ink-3);font-weight:500}
.next-name{font-size:26px;font-weight:700;line-height:1.15;letter-spacing:-.01em;text-wrap:balance}
.next-addr{font-size:16px;color:var(--ink-2);margin-top:4px}
.next-desc{display:flex;gap:10px;align-items:flex-start;background:var(--surface-2);border-radius:12px;padding:12px;font-size:15px;line-height:1.5}
.next-desc svg{width:18px;height:18px;margin-top:2px;color:var(--ink-3)}
.chips-row{display:flex;flex-wrap:wrap;gap:8px}
.chip-i{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:16px;background:var(--surface-2);font-size:14px;color:var(--ink-2)}
.chip-i svg{width:16px;height:16px}
.chip-i.go{background:var(--accent-soft);color:var(--accent)}
.chip-i.here{background:var(--ok-soft);color:var(--ok);font-weight:600}
.status-note{font-size:14px;border-radius:12px;padding:10px 12px;font-weight:500}
.status-note.retry{background:var(--retry-soft);color:var(--retry)}
.status-note.failed{background:var(--fail-soft);color:var(--fail)}
.status-note.delivered{background:var(--ok-soft);color:var(--ok)}
.next-sec{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn2{height:50px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);font-size:16px;font-weight:500;display:flex;align-items:center;justify-content:center;gap:8px;color:var(--ink-2)}
.btn2 svg{width:19px;height:19px}
.btn2.danger{color:var(--fail)}
.btn2:active{background:var(--surface-2)}
.done-card{align-items:center;text-align:center;padding:28px 20px}
.done-card .ic{width:64px;height:64px;border-radius:50%;background:var(--ok-soft);color:var(--ok);display:grid;place-items:center}
.done-card .ic svg{width:32px;height:32px}
.done-card h2{margin:0;font-size:24px}
.done-card p{margin:0;color:var(--ink-2)}

.list-sec{display:flex;flex-direction:column;gap:12px}
.list-sec h2{margin:0;font-size:18px;font-weight:600}
.seg.full{display:grid;width:100%}
.rows{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.srow{display:flex;align-items:center;gap:12px;width:100%;min-height:70px;padding:12px 14px;text-align:start;border-bottom:1px solid var(--line)}
.srow:last-child{border-bottom:0}
.srow:active{background:var(--surface-2)}
.srow.cur{background:var(--accent-soft)}
.srow .n{width:34px;height:34px;border-radius:50%;background:var(--surface-3);display:grid;place-items:center;font-size:14px;font-weight:600;color:var(--ink-2);flex:none}
.srow.cur .n{background:var(--brand);color:var(--brand-ink)}
.srow .m{flex:1;min-width:0}
.srow .m b{display:block;font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srow .m span{display:block;font-size:13.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{padding:28px 16px;text-align:center;color:var(--ink-3)}
.c-foot-note{font-size:12.5px;color:var(--ink-3);text-align:center;padding-bottom:8px}

/* action bar — always at the thumb */
.c-actions{flex:none;background:var(--surface);border-top:1px solid var(--line);padding:8px 16px calc(12px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;box-shadow:0 -6px 20px rgba(14,27,36,.06)}
.c-target{font-size:13px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
.c-target b{color:var(--ink);font-weight:600}
.c-btns{display:grid;grid-template-columns:1fr 1.45fr;gap:10px}
.a-btn{height:62px;border-radius:16px;display:flex;align-items:center;justify-content:center;gap:10px;font-size:19px;font-weight:600;text-decoration:none;transition:transform .08s;-webkit-user-select:none;user-select:none}
.a-btn:active{transform:scale(.97)}
.a-btn svg{width:24px;height:24px}
.a-nav{background:var(--brand-soft);color:var(--brand-text)}
.a-done{background:var(--ok);color:#fff;font-size:21px;font-weight:700}
.a-reset{background:var(--surface-2);color:var(--ink-2);border:1.5px solid var(--line);font-size:17px}

/* map view */
.c-map{flex:1;min-height:0;display:flex;flex-direction:column}
.c-map-box{flex:1;min-height:240px;position:relative}
.c-map-box .lmap{position:absolute;inset:0;border:0;border-radius:0}
.fabs{position:absolute;z-index:600;bottom:12px;inset-inline-start:12px;display:flex;flex-direction:column;gap:8px}
.fab{height:44px;padding:0 14px;border-radius:22px;background:var(--surface);box-shadow:var(--shadow-2);display:flex;align-items:center;gap:8px;font-size:14px;font-weight:500;color:var(--ink)}
.fab svg{width:18px;height:18px}
.c-strip{flex:none;background:var(--surface);border-top:1px solid var(--line);padding:12px 16px;display:flex;align-items:center;gap:12px}
.c-strip .n{width:40px;height:40px;border-radius:12px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-weight:700;font-size:17px;flex:none}
.c-strip .m{flex:1;min-width:0}
.c-strip .m b{display:block;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c-strip .m span{display:block;font-size:13.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c-strip .x{height:44px;padding:0 12px;border-radius:12px;border:1.5px solid var(--line);color:var(--fail);font-size:14px;font-weight:500;flex:none}

/* sheets */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:2000;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.sheet{background:var(--surface);width:100%;max-width:640px;border-radius:22px 22px 0 0;padding:8px 16px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px;animation:up .2s ease-out;max-height:92%;overflow-y:auto}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line-2);align-self:center;margin:4px 0 6px}
.sheet h3{margin:0;font-size:20px}
.sheet .sub{margin:0 0 4px;color:var(--ink-3);font-size:14px}
.reason{min-height:60px;border-radius:14px;border:1.5px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 16px;font-size:17px;font-weight:500;text-align:start;width:100%}
.reason:active{background:var(--surface-2)}
.reason svg{width:22px;height:22px}
.reason .tag{margin-inline-start:auto;font-size:12px;font-weight:500;padding:4px 8px;border-radius:8px;white-space:nowrap}
.reason .tag.retry{background:var(--retry-soft);color:var(--retry)}
.reason .tag.failed{background:var(--fail-soft);color:var(--fail)}
.reason.sel{border-color:var(--ink)}
.sheet textarea{font-size:16px;width:100%;min-height:84px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface-2);padding:12px}
.sheet-primary{height:56px;border-radius:14px;background:var(--brand);color:var(--brand-ink);font-size:17px;font-weight:600;width:100%}
.sheet-ghost{height:50px;border-radius:14px;color:var(--ink-2);font-size:16px;width:100%}
.menu-item{min-height:56px;border-radius:14px;background:var(--surface-2);display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 14px;font-size:16px;width:100%;text-align:start;flex-wrap:wrap}
.menu-item svg{width:20px;height:20px}
.foot-note{font-size:13px;color:var(--ink-3);line-height:1.5;margin:4px 2px 0}
.c-toast{position:absolute;inset-inline:16px;bottom:calc(128px + env(safe-area-inset-bottom,0px));z-index:1500;background:#0E1B24;color:#fff;border-radius:14px;padding:6px 6px 6px 14px;display:flex;align-items:center;gap:10px;font-size:15px;box-shadow:0 8px 24px rgba(0,0,0,.3);animation:up .2s ease-out}
.c-toast span{flex:1;min-width:0;padding-inline-start:8px}
.c-toast button{height:44px;padding:0 16px;border-radius:10px;background:rgba(255,255,255,.14);color:#9EC1FF;font-weight:600;flex:none}
.c-empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:32px 24px;text-align:center;color:var(--ink-2)}
.c-empty b{font-size:22px;color:var(--ink)}
.c-empty p{margin:0;line-height:1.55}

@keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{0%{transform:scale(.97)}60%{transform:scale(1.01)}100%{transform:none}}
.pop{animation:pop .25s ease-out}

/* =====================================================================
   ROLE PICKER
   ===================================================================== */
.pick{min-height:100%;display:flex;align-items:center;justify-content:center;padding-block:32px;padding-inline:16px;background:var(--ground)}
.pick-box{width:100%;max-width:440px;display:flex;flex-direction:column;gap:22px}
.pick-logo{width:48px;height:48px;border-radius:14px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center}
.pick-logo svg{width:26px;height:26px}
.pick-brand{font-size:28px;font-weight:700;line-height:1.15;letter-spacing:-.01em}
.pick-brand small{display:block;font-size:15px;color:var(--ink-2);margin-top:6px;font-weight:400;letter-spacing:0}
.pick-group{display:flex;flex-direction:column;gap:8px}
.pick-label{font-size:13px;color:var(--ink-3);font-weight:500}
.pick-btn{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;text-align:start;width:100%;min-height:72px}
.pick-btn:active,.pick-btn:hover{border-color:var(--line-2);background:var(--surface-2)}
.pick-ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;flex:none;color:#fff;font-weight:600;font-size:17px}
.pick-ic svg{width:22px;height:22px}
.pick-btn .t{flex:1;min-width:0}
.pick-btn b{display:block;font-size:17px}
.pick-btn span.s{font-size:13.5px;color:var(--ink-3)}
.pick-btn .chev{width:20px;height:20px;color:var(--ink-3)}
.pick-note{font-size:13px;color:var(--ink-3);line-height:1.55;margin:0}
.mode-dot{display:inline-flex;align-items:flex-start;gap:8px;font-size:13px;color:var(--ink-2);line-height:1.45}
.mode-dot i{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block;flex:none;margin-top:6px}
.mode-dot.local i{background:var(--retry)}

/* =====================================================================
   MANAGER — mobile base
   ===================================================================== */
.adm{height:100%;display:flex;flex-direction:column;background:var(--ground)}
.side{display:none}
.m-top{flex:none;background:var(--surface);border-bottom:1px solid var(--line);height:56px;padding-inline:8px 16px;display:flex;align-items:center;gap:10px}
.m-top .logo{width:34px;height:34px;border-radius:10px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;flex:none}
.m-top .logo svg{width:19px;height:19px}
.m-top b{flex:1;min-width:0;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m-top .c-icon{margin-inline-start:auto}
.main{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding-block:16px 24px;padding-inline:16px;-webkit-overflow-scrolling:touch}
.m-nav{flex:none;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(3,1fr);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.m-nav button{height:54px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;color:var(--ink-3)}
.m-nav button svg{width:22px;height:22px}
.m-nav button[aria-current="page"]{color:var(--brand-text);font-weight:600}
.m-nav .plus{width:44px;height:36px;border-radius:12px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center}
.m-nav .plus svg{width:22px;height:22px}

.page{max-width:1280px;margin-inline:auto;display:flex;flex-direction:column;gap:16px;min-width:0}
.page-head{display:flex;flex-direction:column;gap:12px}
.page-head h1{margin:0;font-size:23px;font-weight:700;line-height:1.2;letter-spacing:-.01em;text-wrap:balance}
.page-head .sub{color:var(--ink-3);font-size:14px;margin-top:4px}
.page-head .sub svg{width:15px;height:15px;vertical-align:-2px}
.head-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.crumb{display:inline-flex;align-items:center;gap:4px;color:var(--ink-3);font-size:14px;height:36px;margin-bottom:2px}
.crumb svg{width:18px;height:18px}

/* buttons */
.b{min-height:44px;padding:0 16px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-size:15px;font-weight:500;white-space:nowrap;border:1px solid transparent;text-align:center}
.b svg{width:18px;height:18px}
.b:disabled{opacity:.45;cursor:not-allowed}
.b-primary{background:var(--brand);color:var(--brand-ink)}
.b-sec{background:var(--surface);border-color:var(--line-2);color:var(--ink)}
.b-ghost{color:var(--ink-2)}
.b-danger{color:var(--fail);border-color:var(--line-2);background:var(--surface)}
.b-danger.armed{background:var(--fail);color:#fff;border-color:var(--fail)}
.b-ok{background:var(--ok);color:#fff}
.b-sm{min-height:40px;padding:0 12px;font-size:14px;border-radius:10px}
.b-lg{min-height:50px;padding:0 20px;font-size:16px}
.b-block{width:100%}
@media (hover:hover){.b-primary:not(:disabled):hover{filter:brightness(1.15)}.b-sec:not(:disabled):hover{background:var(--surface-2)}.b-ghost:not(:disabled):hover{background:var(--surface-2)}}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi.wide{grid-column:1/-1;flex-direction:row;align-items:center;justify-content:space-between}
.kpi b{font-size:28px;font-weight:700;line-height:1.05;letter-spacing:-.02em}
.kpi span{font-size:13.5px;color:var(--ink-2)}
.kpi.ok b{color:var(--ok)} .kpi.warn b{color:var(--retry)} .kpi.info b{color:var(--accent)}

/* panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;min-width:0}
.panel-head{padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.panel-head h2{margin:0;font-size:16px;font-weight:600}
.panel-body{padding:16px}
.sec-title{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:4px}
.sec-title h2{margin:0;font-size:17px;font-weight:600}
.lbl{font-size:13px;color:var(--ink-3)}
.muted{color:var(--ink-3)}

/* mobile cards (task list, stops) */
.cards{display:flex;flex-direction:column;gap:10px}
.tcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px 16px;display:flex;flex-direction:column;gap:10px;width:100%;text-align:start;min-width:0}
button.tcard:active{background:var(--surface-2)}
.tcard-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.tcard-top .t{min-width:0}
.tcard-top b{display:block;font-size:16px;font-weight:600}
.tcard-top span.s{display:block;font-size:13px;color:var(--ink-3)}
.tcard-stats{display:flex;gap:14px;flex-wrap:wrap;font-size:13.5px;color:var(--ink-2)}
.tcard-stats b{font-weight:600}
.tcard-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.bar{height:6px;border-radius:4px;background:var(--surface-3);overflow:hidden;display:flex;min-width:60px}
.bar i{display:block;height:100%}
.cdots{display:flex;gap:4px;flex-wrap:wrap}
.cdot{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:2px 9px 2px 7px;white-space:nowrap}
.cdot i{width:8px;height:8px;border-radius:50%;display:inline-block}
.empty-note{padding:28px 16px;text-align:center;color:var(--ink-3)}

/* tables (tablet / desktop only) */
.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:start;font-weight:500;color:var(--ink-3);font-size:12.5px;padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface-2)}
.tbl td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:var(--surface-2)}
.tbl tr.hi td{background:var(--accent-soft)}
.tbl tr.flash td,.flash{animation:flash 2.4s ease-out}
@keyframes flash{0%{background:var(--accent-soft)}100%{background:transparent}}
.tbl .n{font-variant-numeric:tabular-nums;white-space:nowrap}
.t-name{font-weight:600}
.t-sub{font-size:12.5px;color:var(--ink-3);margin-top:1px}

/* feed */
.feed{display:flex;flex-direction:column}
.feed button{display:flex;gap:12px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);text-align:start;width:100%;min-height:60px}
.feed button:last-child{border-bottom:0}
.feed button:active{background:var(--surface-2)}
.feed .f-main{flex:1;min-width:0;font-size:14px;line-height:1.4}
.feed .f-main b{font-weight:600}
.feed .f-time{font-size:12.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.live{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ok);font-weight:500}
.live i{width:7px;height:7px;border-radius:50%;background:var(--ok);animation:pulse 1.8s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(21,128,77,.5)}70%{box-shadow:0 0 0 7px rgba(21,128,77,0)}100%{box-shadow:0 0 0 0 rgba(21,128,77,0)}}
.dash-grid{display:flex;flex-direction:column;gap:16px;min-width:0}

/* chips & tabs */
.a-chips{display:flex;gap:6px;flex-wrap:wrap}
.a-chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding-inline:16px}
.a-chips.scroll::-webkit-scrollbar{display:none}
.a-chip{min-height:40px;padding:0 14px;border-radius:20px;border:1px solid var(--line-2);background:var(--surface);font-size:14px;color:var(--ink-2);display:inline-flex;align-items:center;gap:7px;flex:none;white-space:nowrap}
.a-chip[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.a-chip i{width:10px;height:10px;border-radius:50%;display:inline-block}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;background:var(--surface-3);padding:4px;border-radius:14px}
.step{border-radius:11px;padding:8px 6px;display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center;min-width:0;min-height:56px;justify-content:center}
.step:disabled{opacity:.45;cursor:not-allowed}
.step[aria-selected="true"]{background:var(--surface);box-shadow:var(--shadow-1)}
.step .sn{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--surface);font-weight:600;font-size:12.5px;border:1px solid var(--line-2)}
.step.ok .sn{background:var(--ok);color:#fff;border-color:var(--ok)}
.step .sn svg{width:14px;height:14px}
.step b{display:block;font-size:13px;font-weight:600;line-height:1.2}
.step span.s{display:none}

.summary{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.sum{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;border:1px solid var(--line);background:var(--surface);text-align:start;min-height:60px;min-width:0}
.sum[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.sum .t{min-width:0}
.sum b{display:block;font-size:20px;font-weight:700;line-height:1.1}
.sum span.l{display:block;font-size:12.5px;color:var(--ink-2);line-height:1.3}
.sum .ic{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;flex:none}
.sum .ic svg{width:17px;height:17px}
.ic.ok{background:var(--ok-soft);color:var(--ok)} .ic.warn{background:var(--retry-soft);color:var(--retry)} .ic.bad{background:var(--fail-soft);color:var(--fail)} .ic.all{background:var(--surface-3);color:var(--ink-2)}

.mstate{display:flex;align-items:flex-start;gap:8px;font-size:14px}
.mstate svg{width:18px;height:18px;margin-top:1px}
.mstate.ok{color:var(--ok)} .mstate.warn{color:var(--retry)} .mstate.bad{color:var(--fail)}
.mstate small{display:block;color:var(--ink-3);font-size:13px}
.cands{display:flex;flex-direction:column;gap:6px}
.cand{display:flex;align-items:center;gap:10px;border:1px solid var(--line-2);border-radius:12px;padding:8px 8px 8px 12px;background:var(--surface-2);text-align:start;width:100%;min-height:56px}
.cand .cn{flex:1;min-width:0;font-size:14px}
.cand .cn small{display:block;color:var(--ink-3);font-size:12.5px}
.cand .go{min-height:40px;padding:0 12px;border-radius:10px;background:var(--surface);border:1px solid var(--line-2);display:flex;align-items:center;font-size:14px;font-weight:500;flex:none}
.row-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.row-actions.one{grid-template-columns:1fr}
.banner{display:flex;align-items:flex-start;gap:10px;padding:12px 14px;border-radius:14px;font-size:14px;flex-wrap:wrap}
.banner svg{width:19px;height:19px;margin-top:1px}
.banner.warn{background:var(--retry-soft);color:var(--retry)}
.banner.ok{background:var(--ok-soft);color:var(--ok)}
.banner.info{background:var(--accent-soft);color:var(--accent)}
.banner .grow{flex:1;min-width:180px}
.banner b{font-weight:600}
.banner .b{flex:none}

/* assign */
.split{display:flex;flex-direction:column;gap:14px;min-width:0}
.cols{display:flex;flex-direction:column;gap:12px;min-width:0}
.ccol{border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);overflow:hidden}
.ccol-head{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);background:var(--surface-2)}
.ccol-head i{width:12px;height:12px;border-radius:50%;flex:none}
.ccol-head b{font-size:15px}
.ccol-head .s{font-size:12.5px;color:var(--ink-3);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.arow{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);font-size:14px;min-height:60px}
.arow:last-child{border-bottom:0}

function pointInRing(p, ring) {
  let inside = false;
  for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
    const [xi, yi] = ring[i], [xj, yj] = ring[j];
    if (((yi > p[1]) !== (yj > p[1])) && (p[0] < (xj - xi) * (p[1] - yi) / (yj - yi) + xi)) inside = !inside;
  }

}
function ringCentroid(ring) {
  let a = 0, x = 0, y = 0;
  for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
    const f = ring[j][0] * ring[i][1] - ring[i][0] * ring[j][1]; a += f; x += (ring[j][0] + ring[i][0]) * f; y += (ring[j][1] + ring[i][1]) * f;
  }
  if (Math.abs(a) < 1e-14) { const n = ring.length; return { lng: ring.reduce((s, p) => s + p[0], 0) / n, lat: ring.reduce((s, p) => s + p[1], 0) / n }; }
  return { lng: x / (3 * a), lat: y / (3 * a) };
}
function featureRing(f, p) {
  const g = f.geometry; if (!g) return null;
  const polys = g.type === "Polygon" ? [g.coordinates] : g.type === "MultiPolygon" ? g.coordinates : [];
  const hit = polys.find(pl => pl[0] && pointInRing(p, pl[0])) || polys[0];
  return hit && hit[0] && hit[0].length > 3 ? hit[0] : null;
}
function simplifyRing(ring, max = 64) {
  if (ring.length <= max) return ring;
  const step = Math.ceil(ring.length / max); const out = ring.filter((_, i) => i % step === 0); out.push(ring[0]); return out;
}

const unflatRing = a => { const r = []; for (let i = 0; i + 1 < a.length; i += 2) r.push([a[i], a[i + 1]]); return r; };

    if (!h.ring && Array.isArray(p.footprint) && p.footprint.length >= 8) h.ring = unflatRing(p.footprint);
