:root{
  --ground:#EEF1F0; --surface:#FFFFFF; --surface-2:#F5F7F6; --ink:#13222B; --ink-2:#4A5A63; --ink-3:#7C8B92;
  --line:#DCE2E0; --brand:#16303F; --brand-ink:#FFFFFF; --gold:#B8862B; --gold-soft:#F4E9D2;
  --ok:#1D8A55; --ok-soft:#DDF2E6; --retry:#C27A12; --retry-soft:#FBEBD0; --fail:#C23B34; --fail-soft:#F8DEDC;
  --pending-soft:#E6ECEF; --shadow:0 1px 2px rgba(19,34,43,.06),0 6px 20px rgba(19,34,43,.07);
  --map-bg:#E4E9E6; --map-grid:rgba(22,48,63,.07);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ground:#0D1519; --surface:#152128; --surface-2:#1B2931; --ink:#E9EFF1; --ink-2:#A9B7BE; --ink-3:#7D8D95;
    --line:#26363F; --brand:#0A1318; --brand-ink:#F2F5F6; --gold:#D8A94F; --gold-soft:#3A2F1B;
    --ok:#34B874; --ok-soft:#153526; --retry:#E3A13C; --retry-soft:#3A2B14; --fail:#EA6A62; --fail-soft:#3D1D1B;
    --pending-soft:#22313A; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
    --map-bg:#111C22; --map-grid:rgba(233,239,241,.05);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#0D1519; --surface:#152128; --surface-2:#1B2931; --ink:#E9EFF1; --ink-2:#A9B7BE; --ink-3:#7D8D95;
  --line:#26363F; --brand:#0A1318; --brand-ink:#F2F5F6; --gold:#D8A94F; --gold-soft:#3A2F1B;
  --ok:#34B874; --ok-soft:#153526; --retry:#E3A13C; --retry-soft:#3A2B14; --fail:#EA6A62; --fail-soft:#3D1D1B;
  --pending-soft:#22313A; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
  --map-bg:#111C22; --map-grid:rgba(233,239,241,.05);
}
html,body{height:100%}
body{background:var(--ground);color:var(--ink);font-family:"Rubik",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;font-size:15px;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
*{box-sizing:border-box}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
#root{height:100%}
.app{height:100%;display:flex;flex-direction:column;max-width:560px;margin-inline:auto;position:relative;background:var(--ground)}

/* header */
.top{background:var(--brand);color:var(--brand-ink);padding:14px 16px 16px;display:flex;flex-direction:column;gap:14px}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.task-label{font-size:12px;letter-spacing:.06em;opacity:.7}
.task-no{font-family:"Secular One","Rubik",sans-serif;font-size:26px;line-height:1.1;letter-spacing:.01em}
.task-no span{color:var(--gold)}
.task-sub{font-size:13px;opacity:.8;margin-top:2px}
.icon-btn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:rgba(255,255,255,.1)}
.icon-btn svg{width:20px;height:20px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{background:rgba(255,255,255,.08);border-radius:12px;padding:8px 6px 7px;text-align:center}
.stat b{display:block;font-family:"Secular One","Rubik",sans-serif;font-size:22px;line-height:1.15;font-weight:400}
.stat small{font-size:11.5px;opacity:.78}
.stat.ok b{color:#6FE0A2}.stat.fail b{color:#FF9C95}.stat.retry b{color:#FFC76A}
.progress{height:6px;border-radius:6px;background:rgba(255,255,255,.12);overflow:hidden;display:flex}
.progress i{display:block;height:100%}
.progress-txt{display:flex;justify-content:space-between;font-size:12px;opacity:.8;margin-top:-6px}

/* body */
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 16px 16px;display:flex;flex-direction:column;gap:18px}
.card{background:var(--surface);border-radius:20px;box-shadow:var(--shadow);padding:16px;display:flex;flex-direction:column;gap:14px}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.eyebrow{font-size:12px;letter-spacing:.05em;color:var(--ink-3);font-weight:500}
.stepper{display:flex;gap:6px}
.stepper button{width:40px;height:40px;border-radius:12px;background:var(--surface-2);display:grid;place-items:center;border:1px solid var(--line)}
.stepper button:disabled{opacity:.35}
.stepper svg{width:18px;height:18px}
.who{display:flex;gap:12px;align-items:flex-start}
.seq{flex:none;width:44px;height:44px;border-radius:14px;background:var(--gold-soft);color:var(--gold);display:grid;place-items:center;font-family:"Secular One","Rubik",sans-serif;font-size:20px}
.name{font-size:24px;font-weight:700;line-height:1.2;text-wrap:balance}
.addr{font-size:15px;color:var(--ink-2);margin-top:3px}
.hint{display:flex;gap:10px;align-items:flex-start;background:var(--surface-2);border-radius:14px;padding:11px 12px;font-size:15px;line-height:1.45}
.hint svg{flex:none;width:18px;height:18px;margin-top:2px;color:var(--gold)}
.status-line{font-size:13.5px;border-radius:10px;padding:8px 10px;font-weight:500}
.status-line.retry{background:var(--retry-soft);color:var(--retry)}
.status-line.fail{background:var(--fail-soft);color:var(--fail)}
.status-line.ok{background:var(--ok-soft);color:var(--ok)}
.actions{display:grid;grid-template-columns:1fr 1.6fr;gap:10px}
.btn{height:64px;border-radius:16px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:18px;font-weight:600;text-decoration:none;transition:transform .08s}
.btn:active{transform:scale(.97)}
.btn svg{width:22px;height:22px}
.btn-nav{background:var(--surface-2);border:1.5px solid var(--line);color:var(--ink)}
.btn-done{background:var(--ok);color:#fff;font-size:21px;box-shadow:0 6px 16px rgba(29,138,85,.28)}
.btn-fail{height:48px;border-radius:14px;border:1.5px solid var(--line);color:var(--fail);font-size:16px;font-weight:500;width:100%}
.btn-undo-status{height:44px;border-radius:12px;background:var(--surface-2);font-size:15px;color:var(--ink-2);width:100%}

.alldone{text-align:center;padding:28px 16px;align-items:center}
.alldone .big{font-family:"Secular One","Rubik",sans-serif;font-size:26px}
.alldone p{margin:0;color:var(--ink-2);line-height:1.5}
.alldone .check{width:64px;height:64px;border-radius:50%;background:var(--ok-soft);color:var(--ok);display:grid;place-items:center}

/* list */
.list-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.list-head h2{margin:0;font-size:17px;font-weight:600}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:36px;padding:0 14px;border-radius:18px;background:var(--surface);border:1px solid var(--line);font-size:14px;color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
:root[data-theme="dark"] .chip[aria-pressed="true"]{background:var(--gold);color:#1a1409;border-color:var(--gold)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .chip[aria-pressed="true"]{background:var(--gold);color:#1a1409;border-color:var(--gold)}}
.rows{display:flex;flex-direction:column;background:var(--surface);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;text-align:start;width:100%;border-bottom:1px solid var(--line);min-height:68px}
.row:last-child{border-bottom:0}
.row.current{background:var(--gold-soft)}
.row-seq{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:600;background:var(--pending-soft);color:var(--ink-2)}
.row-seq.delivered{background:var(--ok);color:#fff}.row-seq.retry{background:var(--retry);color:#fff}.row-seq.failed{background:var(--fail);color:#fff}
.row-main{flex:1;min-width:0}
.row-name{font-weight:600;font-size:16px}
.row-sub{font-size:13px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{flex:none;font-size:12px;font-weight:500;padding:4px 9px;border-radius:10px;white-space:nowrap}
.pill.pending{background:var(--pending-soft);color:var(--ink-2)}
.pill.delivered{background:var(--ok-soft);color:var(--ok)}
.pill.retry{background:var(--retry-soft);color:var(--retry)}
.pill.failed{background:var(--fail-soft);color:var(--fail)}
.empty{padding:22px;text-align:center;color:var(--ink-3)}

/* tabbar */
.tabbar{display:grid;grid-template-columns:1fr 1fr;background:var(--surface);border-top:1px solid var(--line);padding:6px 16px calc(6px + env(safe-area-inset-bottom,0px));gap:8px}
.tab{height:52px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12.5px;color:var(--ink-3)}
.tab svg{width:22px;height:22px}
.tab[aria-selected="true"]{color:var(--ink);background:var(--surface-2);font-weight:600}

/* map */
.mapwrap{flex:1;position:relative;display:flex;flex-direction:column;min-height:0}
#map{flex:1;min-height:0;background-color:var(--map-bg);background-image:linear-gradient(var(--map-grid) 1px,transparent 1px),linear-gradient(90deg,var(--map-grid) 1px,transparent 1px);background-size:32px 32px}
.leaflet-container{font-family:inherit}
.map-note{position:absolute;top:10px;inset-inline:16px;z-index:500;background:var(--surface);color:var(--ink-2);font-size:12px;padding:7px 10px;border-radius:10px;box-shadow:var(--shadow);text-align:center}
.fit-btn{position:absolute;z-index:500;inset-inline-start:16px;bottom:12px;height:40px;padding:0 12px;border-radius:12px;background:var(--surface);box-shadow:var(--shadow);font-size:13px;font-weight:500;display:flex;align-items:center;gap:6px}
.fit-btn svg{width:16px;height:16px}
.mapsheet{background:var(--surface);border-radius:20px 20px 0 0;box-shadow:0 -6px 24px rgba(0,0,0,.12);padding:14px 16px 14px;display:flex;flex-direction:column;gap:12px;position:relative;z-index:600}
.mapsheet .name{font-size:20px}
.mapsheet .btn{height:58px}
.pin{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font:600 13px "Rubik",sans-serif;color:#fff;border:2.5px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.35);background:#5B6B73}
.pin.delivered{background:#1D8A55}.pin.retry{background:#C27A12}.pin.failed{background:#C23B34}
.pin.current{width:40px;height:40px;font-size:16px;background:#16303F;border-color:#D8A94F;border-width:3px;box-shadow:0 0 0 6px rgba(216,169,79,.35),0 3px 8px rgba(0,0,0,.4)}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(8,14,18,.5);z-index:2000;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.sheet{background:var(--surface);width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:10px 16px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px;animation:up .2s ease-out;max-height:90%;overflow-y:auto}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);align-self:center;margin-bottom:4px}
.sheet h3{margin:0 0 2px;font-size:19px}
.sheet .sub{margin:0 0 4px;color:var(--ink-3);font-size:14px}
.reason{height:60px;border-radius:14px;border:1.5px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 16px;font-size:17px;font-weight:500;text-align:start}
.reason svg{width:22px;height:22px;flex:none}
.reason .tag{margin-inline-start:auto;font-size:12px;font-weight:500;padding:3px 8px;border-radius:8px}
.reason .tag.retry{background:var(--retry-soft);color:var(--retry)}
.reason .tag.failed{background:var(--fail-soft);color:var(--fail)}
.reason.sel{border-color:var(--ink)}
textarea{font:inherit;font-size:16px;width:100%;min-height:84px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface-2);color:var(--ink);padding:12px}
.sheet .btn-primary{height:56px;border-radius:14px;background:var(--brand);color:var(--brand-ink);font-size:17px;font-weight:600}
.sheet .btn-ghost{height:48px;border-radius:14px;color:var(--ink-2);font-size:16px}
.menu-item{height:54px;border-radius:14px;background:var(--surface-2);display:flex;align-items:center;justify-content:space-between;padding:0 14px;font-size:16px}
.seg{display:flex;background:var(--surface-2);border-radius:12px;padding:3px;gap:3px}
.seg button{height:38px;padding:0 14px;border-radius:10px;font-size:14px;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:var(--shadow)}
.foot-note{font-size:12.5px;color:var(--ink-3);line-height:1.5;margin:4px 2px 0}

/* toast */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:1500;background:#13222B;color:#fff;border-radius:14px;padding:6px 6px 6px 16px;display:flex;align-items:center;gap:12px;font-size:15px;box-shadow:0 8px 24px rgba(0,0,0,.3);width:calc(100% - 32px);max-width:528px;animation:up .2s ease-out}
.toast span{flex:1;padding-inline-start:10px}
.toast button{height:42px;padding:0 16px;border-radius:10px;background:rgba(255,255,255,.12);color:#FFD27A;font-weight:600}
@keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
.toast{animation-name:toastup}
@keyframes toastup{from{transform:translate(-50%,24px);opacity:.4}to{transform:translate(-50%,0);opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{0%{transform:scale(.96)}60%{transform:scale(1.02)}100%{transform:none}}
.pop{animation:pop .28s ease-out}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}


/* ===== extra tokens (manager) ===== */
:root{
  --info:#2F6FDB; --info-soft:#E3ECFB; --road:#FFFFFF; --road-edge:#C9D2CE; --map-label:#5E6E75; --area-label:#9AA8AE;
  --focus-ring:rgba(184,134,43,.45); --scrim:rgba(8,14,18,.5);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --info:#7FA8F0; --info-soft:#1B2A44; --road:#2A3A43; --road-edge:#1A262D; --map-label:#9FB0B8; --area-label:#5F717A; }
}
:root[data-theme="dark"]{ --info:#7FA8F0; --info-soft:#1B2A44; --road:#2A3A43; --road-edge:#1A262D; --map-label:#9FB0B8; --area-label:#5F717A; }

input,select,textarea{font:inherit;color:var(--ink)}
.pill.draft{background:var(--pending-soft);color:var(--ink-2)}
.pill.locating{background:var(--retry-soft);color:var(--retry)}
.pill.assigning{background:var(--info-soft);color:var(--info)}
.pill.active{background:var(--info-soft);color:var(--info)}
.pill.finished{background:var(--ok-soft);color:var(--ok)}
.pill.done{background:var(--pending-soft);color:var(--ink-2)}

/* ===== shared map ===== */
.lmap{position:relative;border-radius:14px;overflow:hidden;border:1px solid var(--line);min-height:240px}
.lmap-inner{position:absolute;inset:0;background-color:var(--map-bg);background-image:linear-gradient(var(--map-grid) 1px,transparent 1px),linear-gradient(90deg,var(--map-grid) 1px,transparent 1px);background-size:32px 32px}
.lmap.placing .leaflet-grab,.lmap.placing .leaflet-container{cursor:crosshair}
.lmap-note{position:absolute;z-index:500;bottom:8px;inset-inline-end:8px;background:var(--surface);color:var(--ink-3);font-size:11.5px;padding:4px 8px;border-radius:8px;box-shadow:var(--shadow)}
.lmap-hint{position:absolute;z-index:500;top:10px;left:50%;transform:translateX(-50%);background:var(--brand);color:var(--brand-ink);font-size:13px;padding:7px 12px;border-radius:10px;box-shadow:var(--shadow);white-space:nowrap;max-width:calc(100% - 100px);overflow:hidden;text-overflow:ellipsis}
path.st-edge{stroke:var(--road-edge)} path.st-road{stroke:var(--road)}
.st-label{white-space:nowrap;font:500 11px "Rubik",sans-serif;color:var(--map-label);transform:translate(-50%,-50%);display:inline-block;text-shadow:0 0 3px var(--map-bg),0 0 3px var(--map-bg)}
.area-label{white-space:nowrap;font:600 12px "Rubik",sans-serif;color:var(--area-label);letter-spacing:.04em;transform:translate(-50%,-50%);display:inline-block}
.leaflet-container{background:transparent}
.mk{width:100%;height:100%;border-radius:50%;display:grid;place-items:center;color:#fff;font:600 11px "Rubik",sans-serif;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35);box-sizing:border-box}
.mk.faint{opacity:.55;border-width:1.5px}
.mk.sel{border-color:#D8A94F;border-width:3px;box-shadow:0 0 0 5px rgba(216,169,79,.35),0 2px 6px rgba(0,0,0,.4)}
.mk.ring{border-width:3px}
.mk.new{background:#B8862B!important;border-color:#fff;border-width:3px;box-shadow:0 0 0 6px rgba(184,134,43,.3),0 2px 8px rgba(0,0,0,.4)}

/* ===== role picker ===== */
.pick{min-height:100%;display:flex;align-items:center;justify-content:center;padding-block:32px;padding-inline:16px;background:var(--ground)}
.pick-box{width:100%;max-width:440px;display:flex;flex-direction:column;gap:18px}
.pick-brand{font-family:"Secular One","Rubik",sans-serif;font-size:30px;line-height:1.15;text-wrap:balance}
.pick-brand small{display:block;font-family:"Rubik",sans-serif;font-size:15px;color:var(--ink-2);margin-top:6px;font-weight:400}
.pick-group{display:flex;flex-direction:column;gap:8px}
.pick-label{font-size:12.5px;color:var(--ink-3);font-weight:500;letter-spacing:.04em}
.pick-btn{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;text-align:start;box-shadow:var(--shadow);width:100%}
.pick-btn:hover{border-color:var(--ink-3)}
.pick-ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;flex:none;color:#fff;font-weight:600;font-size:17px}
.pick-ic svg{width:22px;height:22px}
.pick-btn b{display:block;font-size:17px}
.pick-btn span.s{font-size:13px;color:var(--ink-3)}
.pick-note{font-size:12.5px;color:var(--ink-3);line-height:1.55;margin:0}
.mode-dot{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-2)}
.mode-dot i{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block}
.mode-dot.local i{background:var(--retry)}

/* ===== manager shell ===== */
.adm{height:100%;display:grid;grid-template-columns:232px minmax(0,1fr);background:var(--ground)}
.side{background:var(--brand);color:var(--brand-ink);padding:18px 12px;display:flex;flex-direction:column;gap:4px;overflow-y:auto}
.side-brand{font-family:"Secular One","Rubik",sans-serif;font-size:19px;padding:2px 10px 16px;line-height:1.2}
.side-brand small{display:block;font-family:"Rubik",sans-serif;font-size:12px;opacity:.6;margin-top:2px}
.nav-btn{height:42px;border-radius:10px;display:flex;align-items:center;gap:10px;padding:0 12px;color:rgba(255,255,255,.72);font-size:14.5px;width:100%;text-align:start}
.nav-btn svg{width:19px;height:19px;flex:none}
.nav-btn:hover{background:rgba(255,255,255,.06);color:#fff}
.nav-btn[aria-current="page"]{background:rgba(255,255,255,.12);color:#fff;font-weight:600}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:4px;padding-top:16px;border-top:1px solid rgba(255,255,255,.1)}
.side-foot .mode-dot{color:rgba(255,255,255,.7);padding:6px 12px}
.main{overflow-y:auto;padding-block:24px 48px;padding-inline:28px}
.page{max-width:1280px;margin-inline:auto;display:flex;flex-direction:column;gap:20px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.page-head h1{font-family:"Secular One","Rubik",sans-serif;font-weight:400;font-size:28px;margin:0;line-height:1.15;text-wrap:balance}
.page-head .sub{color:var(--ink-3);font-size:14px;margin-top:4px}
.crumb{display:inline-flex;align-items:center;gap:6px;color:var(--ink-3);font-size:13.5px;margin-bottom:6px}
.crumb svg{width:16px;height:16px}
.crumb:hover{color:var(--ink)}

/* buttons */
.b{height:40px;padding:0 16px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-size:14.5px;font-weight:500;white-space:nowrap;border:1px solid transparent}
.b svg{width:17px;height:17px;flex:none}
.b:disabled{opacity:.45;cursor:not-allowed}
.b-primary{background:var(--brand);color:var(--brand-ink)}
.b-primary:not(:disabled):hover{filter:brightness(1.2)}
:root[data-theme="dark"] .b-primary{background:var(--gold);color:#1a1409}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .b-primary{background:var(--gold);color:#1a1409}}
.b-sec{background:var(--surface);border-color:var(--line);color:var(--ink)}
.b-sec:not(:disabled):hover{border-color:var(--ink-3)}
.b-ghost{color:var(--ink-2)}
.b-ghost:not(:disabled):hover{background:var(--surface-2)}
.b-danger{color:var(--fail);border-color:var(--line);background:var(--surface)}
.b-danger.armed{background:var(--fail);color:#fff;border-color:var(--fail)}
.b-ok{background:var(--ok);color:#fff}
.b-sm{height:32px;padding:0 11px;font-size:13.5px;border-radius:8px}
.b-lg{height:46px;padding:0 20px;font-size:15.5px}

/* kpis */
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px 13px;display:flex;flex-direction:column;gap:2px}
.kpi b{font-family:"Secular One","Rubik",sans-serif;font-weight:400;font-size:32px;line-height:1.1}
.kpi span{font-size:13px;color:var(--ink-2)}
.kpi.ok b{color:var(--ok)} .kpi.warn b{color:var(--retry)} .kpi.info b{color:var(--info)}

/* panels & tables */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;min-width:0}
.panel-head{padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px solid var(--line);flex-wrap:wrap;min-height:56px}
.panel-head h2{margin:0;font-size:16px;font-weight:600}
.panel-body{padding:16px}
.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:start;font-weight:500;color:var(--ink-3);font-size:12.5px;padding:9px 14px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface-2)}
.tbl td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:var(--surface-2)}
.tbl tr.hi td{background:var(--gold-soft)}
.tbl tr.flash td{animation:flash 2.4s ease-out}
@keyframes flash{0%{background:var(--gold-soft)}100%{background:transparent}}
.tbl .n{font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl .muted{color:var(--ink-3);font-size:13px}
.t-name{font-weight:600}
.t-sub{font-size:12.5px;color:var(--ink-3);margin-top:1px}
.num-big{font-family:"Secular One","Rubik",sans-serif;font-size:15px}
.bar{height:6px;border-radius:4px;background:var(--pending-soft);overflow:hidden;display:flex;min-width:80px}
.bar i{display:block;height:100%}
.cdots{display:flex;gap:4px;flex-wrap:wrap}
.cdot{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;background:var(--surface-2);border-radius:20px;padding:2px 8px 2px 6px;white-space:nowrap}
.cdot i{width:8px;height:8px;border-radius:50%;display:inline-block}
.empty-note{padding:28px 16px;text-align:center;color:var(--ink-3)}

.dash-grid{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;align-items:start}
.feed{display:flex;flex-direction:column}
.feed button{display:flex;gap:10px;align-items:flex-start;padding:11px 16px;border-bottom:1px solid var(--line);text-align:start;width:100%}
.feed button:last-child{border-bottom:0}
.feed button:hover{background:var(--surface-2)}
.feed i{width:9px;height:9px;border-radius:50%;margin-top:6px;flex:none}
.feed .f-main{flex:1;min-width:0;font-size:13.5px;line-height:1.45}
.feed .f-time{font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.live{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ok);font-weight:500}
.live i{width:7px;height:7px;border-radius:50%;background:var(--ok);animation:pulse 1.8s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(29,138,85,.5)}70%{box-shadow:0 0 0 7px rgba(29,138,85,0)}100%{box-shadow:0 0 0 0 rgba(29,138,85,0)}}

/* chips / tabs */
.a-chips{display:flex;gap:6px;flex-wrap:wrap}
.a-chip{height:32px;padding:0 12px;border-radius:16px;border:1px solid var(--line);background:var(--surface);font-size:13.5px;color:var(--ink-2);display:inline-flex;align-items:center;gap:6px}
.a-chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.a-chip i{width:9px;height:9px;border-radius:50%;display:inline-block}

      });

      if (pt.draggable) m.on("dragend", e => { const q = e.target.getLatLng(); cb.current.onMarkerDrag && cb.current.onMarkerDrag(pt.id, { lat: +q.lat.toFixed(6), lng: +q.lng.toFixed(6) }); });
      m.addTo(lg);
    });
  }, [points]);
  useEffect(() => {
    const lg = lineRef.current; if (!lg) return; lg.clearLayers();
    (lines || []).forEach(l => L.polyline(l.latlngs, { color: l.color, weight: l.weight || 3, opacity: l.opacity || .6, dashArray: l.dash, interactive: false }).addTo(lg));
  }, [lines]);
  useEffect(() => {
    const map = mapRef.current; if (!map || fitKey == null) return;
    const pts = (points || []).filter(p => p.lat != null && !p.noFit);
    if (!pts.length) return;
    if (pts.length === 1) map.setView([pts[0].lat, pts[0].lng], 17);
    else map.fitBounds(L.latLngBounds(pts.map(p => [p.lat, p.lng])).pad(0.12), { animate: false });
  }, [fitKey]);
  useEffect(() => {
    const map = mapRef.current; if (!map || !focus) return;
    setTimeout(() => { map.invalidateSize(); map.setView([focus.lat, focus.lng], Math.max(map.getZoom(), focus.zoom || 17), { animate: true }); }, 30);
  }, [focus && focus.key]);
  return html`<div className=${"lmap " + (placing ? "placing " : "") + (className || "")} style=${style}>
    <div ref=${box} className="lmap-inner" dir="ltr"></div>
    ${hint && html`<div className="lmap-hint">${hint}</div>`}
    ${schem && html`<div className="lmap-note">מפה סכמטית של כפר הדמה</div>`}
    ${children}
  </div>`;
}
const mk = (color, label, cls = "") => `<div class="mk ${cls}" style="background:${color}">${label ?? ""}</div>`;

/* ---------- 6. courier ----------
   השליח נרשם רק לעצירות ששויכו אליו: stops where courierId == me.
   הוא לא קורא את מאגר האנשים ולא עצירות של שליחים אחרים. */
function nextId(items, fromSeq) {
  const pend = items.filter(i => i.status === "pending");
  const after = pend.find(i => i.seq > fromSeq);
  if (after) return after.id;
  if (pend.length) return pend[0].id;
  const retry = items.filter(i => i.status === "retry");
  const rAfter = retry.find(i => i.seq > fromSeq);
  if (rAfter) return rAfter.id;
  return retry.length ? retry[0].id : null;
}
const navUrl = (app, g) => app === "waze"
  ? `https://waze.com/ul?ll=${g.lat},${g.lng}&navigate=yes`
  : `https://www.google.com/maps/dir/?api=1&destination=${g.lat},${g.lng}`;

function CurrentCard({ g, total, navApp, onDone, onFail, onReset, onStep, canPrev, canNext, compact }) {

      <div className="card-head">
        <span className="eyebrow num">יעד ${g.seq} מתוך ${total} · ${g.area}</span>
        <div className="stepper">
          <button onClick=${() => onStep(-1)} disabled=${!canPrev} aria-label="היעד הקודם"><${Icon} n="prev"/></button>
          <button onClick=${() => onStep(1)} disabled=${!canNext} aria-label="היעד הבא"><${Icon} n="next"/></button>
        </div>
      </div>
      <div className="who">
        ${!compact && html`<div className="seq num">${g.seq}</div>`}
        <div>
          <div className="name">${g.first} ${g.last}</div>
          <div className="addr">${g.address}</div>
        </div>
      </div>
      ${!compact && g.desc && html`<div className="hint"><${Icon} n="pin"/><span>${g.desc}</span></div>`}
      ${st === "delivered" && html`<div className="status-line ok">נמסר בשעה ${hhmm(g.at)}</div>`}
      ${st === "retry" && html`<div className="status-line retry">ניסיון קודם: ${REASON_LABEL[g.reason]}${g.note ? ` — ${g.note}` : ""} (${hhmm(g.at)})</div>`}
      ${st === "failed" && html`<div className="status-line fail">לא נמסר: ${REASON_LABEL[g.reason]}${g.note ? ` — ${g.note}` : ""}</div>`}
      ${st === "delivered" || st === "failed" ? html`
        <div className="actions">

          <button className="btn-undo-status btn" style=${{ height: "64px" }} onClick=${onReset}><${Icon} n="undo"/>החזר לממתין</button>
        </div>` : html`
        <div className="actions">

          <button className="btn btn-done" onClick=${onDone}><${Icon} n="check" w=${2.6}/>נמסר</button>
        </div>
        <button className="btn-fail" onClick=${onFail}>לא נמסר</button>`}
    </section>`;
}

}

function CourierMap({ items, current, active, onPick, children }) {
  const [fitKey, setFitKey] = useState(0);
  const [focus, setFocus] = useState(null);
  const points = useMemo(() => items.map(g => {
    const isCur = current && g.id === current.id;
    return { id: g.id, lat: g.lat, lng: g.lng, size: isCur ? 40 : 30, z: isCur ? 1000 : 0, title: `${g.first} ${g.last}`,
      html: `<div class="pin ${g.status} ${isCur ? "current" : ""}">${g.status === "delivered" ? "✓" : g.seq}</div>` };
  }), [items, current && current.id]);
  const lines = useMemo(() => [{ latlngs: items.map(i => [i.lat, i.lng]), color: "#B8862B", weight: 3, opacity: .55, dash: "6 8" }], [items]);
  useEffect(() => { if (active && current) setFocus({ lat: current.lat, lng: current.lng, key: current.id + ":" + Date.now(), zoom: 16 }); }, [active, current && current.id]);
  return html`
    <div className="mapwrap">
      <${LMap} points=${points} lines=${lines} fitKey=${fitKey} focus=${focus} onMarkerClick=${onPick} style=${{ position: "absolute", inset: 0, borderRadius: 0, border: 0 }}>
        <button className="fit-btn" onClick=${() => setFitKey(k => k + 1)}><${Icon} n="fit"/>כל הנקודות</button>

    </div>

}

const NAV_KEY = "dispatch-nav-app";
function CourierApp({ courierId, onExit }) {
  const myStops = useCollection("stops", ["courierId", "==", courierId]);
  const tasks = useCollection("tasks");
  const couriers = useCollection("couriers");
  const me = couriers && couriers.find(c => c.id === courierId);
  const [taskId, setTaskId] = useState(null);
  const [currentId, setCurrentId] = useState(null);
  const [navApp, setNavAppS] = useState(() => { try { return localStorage.getItem(NAV_KEY) || "waze"; } catch (e) { return "waze"; } });
  const setNavApp = v => { setNavAppS(v); try { localStorage.setItem(NAV_KEY, v); } catch (e) { } };
  const [tab, setTab] = useState("list");
  const [failOpen, setFailOpen] = useState(false);
  const [menuOpen, setMenuOpen] = useState(false);
  const [tst, setTst] = useState(null);
  const tstTimer = useRef(null), scrollRef = useRef(null);

  const myTasks = useMemo(() => {
    if (!myStops || !tasks) return [];
    const ids = new Set(myStops.map(s => s.taskId));
    return tasks.filter(t => t.status === "active" && ids.has(t.id)).sort((a, b) => (b.activatedAt || 0) - (a.activatedAt || 0) || b.number - a.number);
  }, [myStops, tasks]);
  useEffect(() => { if (myTasks.length && !myTasks.find(t => t.id === taskId)) setTaskId(myTasks[0].id); }, [myTasks, taskId]);
  const task = myTasks.find(t => t.id === taskId) || null;

  const items = useMemo(() => !myStops || !task ? [] : myStops.filter(s => s.taskId === task.id)
    .sort((a, b) => (a.route || 999) - (b.route || 999) || a.seq - b.seq)
    .map((s, i) => ({ ...s, seq: i + 1, first: s.firstName, last: s.lastName, at: s.updatedAt })), [myStops, task && task.id]);
  useEffect(() => { if (items.length && !items.find(i => i.id === currentId)) setCurrentId(nextId(items, 0) || items[0].id); }, [items, currentId]);

  if (!myStops || !tasks || !couriers) return html`<div className="splash">טוען…</div>`;

  const counts = { total: items.length, delivered: 0, failed: 0, retry: 0, pending: 0 };
  items.forEach(i => counts[i.status]++);
  const current = items.find(i => i.id === currentId) || null;
  const idx = current ? items.indexOf(current) : -1;
  const done = items.length > 0 && counts.pending + counts.retry === 0;

  const showToast = (msg, undo) => { clearTimeout(tstTimer.current); setTst({ msg, undo }); tstTimer.current = setTimeout(() => setTst(null), 5000); };
  const update = (g, status, reason, note, msg) => {
    const now = Date.now();
    const patch = { status, reason, note, updatedAt: now, deliveredAt: status === "delivered" ? now : null };
    const prev = { status: g.status, reason: g.reason, note: g.note || "", updatedAt: g.updatedAt || null, deliveredAt: g.deliveredAt || null };
    const next = items.map(i => i.id === g.id ? { ...i, ...patch } : i);
    setCurrentId(nextId(next, g.seq) || g.id);
    Repo.updateStop(g.id, patch).catch(() => { });
    if (scrollRef.current) scrollRef.current.scrollTo({ top: 0, behavior: "smooth" });
    showToast(msg, () => { Repo.updateStop(g.id, prev).catch(() => { }); setCurrentId(g.id); setTst(null); });
  };
  const markDone = () => update(current, "delivered", null, "", `${current.first} ${current.last} — נמסר ✓`);
  const markFail = (r, note) => { setFailOpen(false); update(current, r.status, r.key, note, `${current.first} ${current.last} — ${r.label}`); };
  const resetOne = () => Repo.updateStop(current.id, { status: "pending", reason: null, note: "", updatedAt: Date.now(), deliveredAt: null }).catch(() => { });
  const step = d => { const n = items[idx + d]; if (n) setCurrentId(n.id); };
  const pick = id => { setCurrentId(id); if (tab === "list" && scrollRef.current) scrollRef.current.scrollTo({ top: 0, behavior: "smooth" }); };
  const pct = k => counts.total ? (counts[k] / counts.total * 100) + "%" : "0%";

  if (!task) return html`
    <div className="app">
      <header className="top">
        <div className="top-row">
          <div><div className="task-label">שלום</div><div className="task-no">${me ? me.name : ""}</div></div>
          <button className="icon-btn" onClick=${onExit} aria-label="החלפת משתמש"><${Icon} n="logout"/></button>
        </div>
      </header>
      <div className="c-empty">
        <div className="big">אין משימה פעילה כרגע</div>
        <p style=${{ margin: 0 }}>כשהמנהל ישלח לך משימת חלוקה, היא תופיע כאן אוטומטית.<br/>אין צורך לרענן את הדף.</p>
      </div>
    </div>`;

  const card = compact => done && !compact ? html`<${AllDone} counts=${counts}/>` : html`<${CurrentCard} g=${current} total=${items.length} navApp=${navApp} compact=${compact}
      onDone=${markDone} onFail=${() => setFailOpen(true)} onReset=${resetOne} onStep=${step} canPrev=${idx > 0} canNext=${idx < items.length - 1}/>`;

  return html`
    <div className="app">
      <header className="top">
        <div className="top-row">
          <div>
            <div className="task-label">משימת חלוקה · ${me ? me.name : ""}</div>
            <div className="task-no num"><span>#</span>${task.number}</div>
            <div className="task-sub">${task.eventName} · ${dayName(task.date)}, ${fmtDate(task.date).split(".").slice(0, 2).join(".")}</div>
          </div>
          <button className="icon-btn" onClick=${() => setMenuOpen(true)} aria-label="הגדרות"><${Icon} n="menu"/></button>
        </div>
        ${myTasks.length > 1 && html`<div className="task-switch" role="group" aria-label="בחירת משימה">
          ${myTasks.map(t => html`<button key=${t.id} aria-pressed=${t.id === task.id} onClick=${() => setTaskId(t.id)}>#${t.number} · ${t.eventName}</button>`)}
        </div>`}
        <div className="stats num">
          <div className="stat"><b>${counts.total}</b><small>סה״כ</small></div>
          <div className="stat ok"><b>${counts.delivered}</b><small>נמסרו</small></div>
          <div className="stat fail"><b>${counts.failed}</b><small>לא נמסרו</small></div>
          <div className="stat retry"><b>${counts.retry}</b><small>לחזור</small></div>
        </div>
        <div className="progress" aria-hidden="true">
          <i style=${{ width: pct("delivered"), background: "#34B874" }}></i>
          <i style=${{ width: pct("retry"), background: "#E3A13C" }}></i>
          <i style=${{ width: pct("failed"), background: "#EA6A62" }}></i>
        </div>
        <div className="progress-txt num"><span>נותרו ${counts.pending} ממתינים</span><span>${counts.total ? Math.round(counts.delivered / counts.total * 100) : 0}% נמסרו</span></div>
      </header>

      <main style=${{ flex: 1, minHeight: 0, display: tab === "list" ? "flex" : "none", flexDirection: "column" }}>
        <div className="scroll" ref=${scrollRef}>
          ${card(false)}
          <${GuestList} items=${items} currentId=${currentId} onPick=${pick}/>
        </div>
      </main>
      <main style=${{ flex: 1, minHeight: 0, display: tab === "map" ? "flex" : "none", flexDirection: "column" }}>
        <${CourierMap} items=${items} current=${current} active=${tab === "map"} onPick=${setCurrentId}>
          ${done ? html`<div style=${{ textAlign: "center", padding: "8px", fontWeight: 600 }}>המשימה הושלמה · ${counts.delivered} נמסרו</div>` : card(true)}
        <//>
      </main>

      <nav className="tabbar" role="tablist">
        <button className="tab" role="tab" aria-selected=${tab === "list"} onClick=${() => setTab("list")}><${Icon} n="list"/>משימה</button>
        <button className="tab" role="tab" aria-selected=${tab === "map"} onClick=${() => setTab("map")}><${Icon} n="map"/>מפה</button>
      </nav>

      ${tst && html`<div className="toast" role="status"><span>${tst.msg}</span><button onClick=${tst.undo}>ביטול</button></div>`}
      ${failOpen && current && html`<${FailSheet} g=${current} onClose=${() => setFailOpen(false)} onSubmit=${markFail}/>`}
      ${menuOpen && html`<${CourierMenu} me=${me} count=${items.length} navApp=${navApp} setNavApp=${setNavApp} onClose=${() => setMenuOpen(false)} onExit=${onExit}/>`}
    </div>`;
}

/* ---------- 7. admin ---------- */
function useCourierMap(couriers) { return useMemo(() => Object.fromEntries((couriers || []).map(c => [c.id, c])), [couriers]); }
const CDot = ({ c }) => c ? html`<span className="cdot"><i style=${{ background: c.color }}></i>${c.name}</span>` : null;

function StatusBar({ c }) {
  const w = k => c.total ? (c[k] / c.total * 100) + "%" : "0";
  return html`<div className="bar" title=${`${c.delivered} נמסרו · ${c.retry} לחזור · ${c.failed} לא נמסרו · ${c.pending} ממתינים`}>
    <i style=${{ width: w("delivered"), background: "var(--ok)" }}></i><i style=${{ width: w("retry"), background: "var(--retry)" }}></i><i style=${{ width: w("failed"), background: "var(--fail)" }}></i></div>`;
}

function Modal({ title, sub, onClose, children, foot, size }) {
  useEffect(() => { const h = e => { if (e.key === "Escape") onClose(); }; window.addEventListener("keydown", h); return () => window.removeEventListener("keydown", h); }, [onClose]);
  return html`<div className="modal-scrim" onMouseDown=${e => { if (e.target === e.currentTarget) onClose(); }}>
    <div className=${"modal " + (size || "")} role="dialog" aria-modal="true" aria-label=${title}>
      <div className="modal-head"><div><h2>${title}</h2>${sub && html`<div className="sub">${sub}</div>`}</div>
        <button className="x-btn" onClick=${onClose} aria-label="סגירה"><${Icon} n="x"/></button></div>
      <div className="modal-body">${children}</div>
      ${foot && html`<div className="modal-foot">${foot}</div>`}
    </div></div>`;
}

function ConfirmButton({ label, confirmLabel, onConfirm, className = "b b-danger b-sm", icon }) {
  const [armed, setArmed] = useState(false);
  useEffect(() => { if (!armed) return; const t = setTimeout(() => setArmed(false), 4000); return () => clearTimeout(t); }, [armed]);
  return html`<button className=${className + (armed ? " armed" : "")} onClick=${() => armed ? (setArmed(false), onConfirm()) : setArmed(true)}>
    ${icon && html`<${Icon} n=${icon}/>`}${armed ? confirmLabel : label}</button>`;
}

/* ===== לוח בקרה ===== */
function Dashboard({ tasks, stops, couriers, go, onNew }) {
  const cmap = useCourierMap(couriers);
  const byTask = useMemo(() => groupBy(stops, "taskId"), [stops]);
  const rows = useMemo(() => tasks.map(t => { const c = statsOf(byTask[t.id] || []); return { t, c, phase: phaseOf(t, c) }; })
    .sort((a, b) => (b.t.date || "").localeCompare(a.t.date || "") || b.t.number - a.t.number), [tasks, byTask]);
  const activeIds = new Set(rows.filter(r => r.phase === "active").map(r => r.t.id));
  const kpi = {
    active: activeIds.size,
    today: stops.filter(s => s.status === "delivered" && isToday(s.deliveredAt)).length,
    open: stops.filter(s => activeIds.has(s.taskId) && s.status !== "delivered").length,
    couriers: new Set(stops.filter(s => activeIds.has(s.taskId) && s.courierId).map(s => s.courierId)).size,
    finished: rows.filter(r => r.phase === "finished" || r.phase === "done").length,
  };
  const taskById = Object.fromEntries(tasks.map(t => [t.id, t]));
  const feed = stops.filter(s => s.updatedAt && taskById[s.taskId]).sort((a, b) => b.updatedAt - a.updatedAt).slice(0, 9);
  return html`<div className="page">
    <div className="page-head">
      <div><h1>לוח בקרה</h1><div className="sub">${new Date().toLocaleDateString("he-IL", { weekday: "long", day: "numeric", month: "long", year: "numeric" })}</div></div>
      <button className="b b-primary b-lg" onClick=${onNew}><${Icon} n="plus"/>משימת חלוקה חדשה</button>
    </div>
    <div className="kpis num">
      <div className="kpi info"><b>${kpi.active}</b><span>משימות פעילות</span></div>
      <div className="kpi ok"><b>${kpi.today}</b><span>הזמנות שנמסרו היום</span></div>
      <div className="kpi warn"><b>${kpi.open}</b><span>עדיין לא נמסרו</span></div>
      <div className="kpi"><b>${kpi.couriers}</b><span>שליחים פעילים</span></div>

        <div className="panel-head"><h2>משימות חלוקה</h2><span className="lbl num">${tasks.length} משימות</span></div>
        <div className="tbl-wrap"><table className="tbl">
          <thead><tr><th>שם אירוע</th><th>תאריך</th><th>הזמנות</th><th>נמסרו</th><th>לא נמסרו</th><th>שליחים</th><th>התקדמות</th><th>סטטוס</th></tr></thead>
          <tbody>
            ${rows.length === 0 && html`<tr><td colSpan="8"><div className="empty-note">אין עדיין משימות. צור משימת חלוקה חדשה כדי להתחיל.</div></td></tr>`}
            ${rows.map(({ t, c, phase }) => html`<tr key=${t.id} className="click" onClick=${() => go({ page: "task", id: t.id })}>
              <td><div className="t-name">${t.eventName}</div><div className="t-sub num">משימה #${t.number}</div></td>

              <td><div className="cdots">${c.couriers.length ? c.couriers.map(id => html`<${CDot} key=${id} c=${cmap[id]}/>`) : html`<span className="muted">—</span>`}</div></td>
              <td style=${{ minWidth: "110px" }}><${StatusBar} c=${c}/></td>
              <td><span className=${"pill " + phase}>${PHASE_LABEL[phase]}${phase === "locating" ? ` (${c.unlocated})` : ""}</span></td>
            </tr>`)}
          </tbody></table></div>
      </section>
      <section className="panel">
        <div className="panel-head"><h2>עדכונים מהשטח</h2><span className="live"><i></i>בזמן אמת</span></div>
        <div className="feed">
          ${feed.length === 0 && html`<div className="empty-note">עדכוני השליחים יופיעו כאן</div>`}
          ${feed.map(s => { const cr = cmap[s.courierId]; return html`<button key=${s.id} onClick=${() => go({ page: "task", id: s.taskId, tab: "track" })}>
            <i style=${{ background: STATUS_COLOR[s.status] }}></i>
            <div className="f-main"><b>${s.firstName} ${s.lastName}</b> — ${STATUS_LABEL[s.status]}${s.reason ? ` · ${REASON_LABEL[s.reason]}` : ""}
              <div className="f-time">${cr ? cr.name + " · " : ""}#${taskById[s.taskId].number} · ${isToday(s.updatedAt) ? hhmm(s.updatedAt) : fmtTs(s.updatedAt)}</div></div>
          </button>`; })}
        </div>
