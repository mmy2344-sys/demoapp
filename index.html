    let loaded = false;
    map.on("error", e => {
      if (e && e.sourceId === "esri-img") { const s = imgRef.current; s.errs++; if (s.errs === 1) setTimeout(() => { if (imgRef.current === s && !s.ok) setImgFailed(true); }, 2500); return; }
      console.warn("map", e && e.error && e.error.message);
    });
    map.on("sourcedata", e => { if (e.sourceId === "esri-img" && e.tile) { imgRef.current.ok = true; } });
    const loadTimer = setTimeout(() => { if (!loaded) setMapErr("המפה לא נטענה. בדוק את החיבור לאינטרנט ונסה שוב."); }, 20000);

    const renderLabels = () => {
      labelsRef.current.forEach(m => m.remove()); labelsRef.current = [];
      if (map.getZoom() < 17) return;
      const b = map.getBounds();
      housesRef.current.filter(h => b.contains([h.lng, h.lat])).slice(0, 150).forEach(h => {
        const el = document.createElement("button");
        el.className = "hlabel " + h.status; el.type = "button"; el.textContent = houseShort(h);
        el.addEventListener("click", ev => { ev.stopPropagation(); openRef.current && openRef.current(h.key); });
        labelsRef.current.push(new maplibregl.Marker({ element: el, anchor: "bottom", offset: [0, -14] }).setLngLat([h.lng, h.lat]).addTo(map));
      });
    };
    renderLabelsRef.current = renderLabels;

    map.on("load", () => {
      loaded = true; clearTimeout(loadTimer);
      const col = ["match", ["get", "status"], "check", HOUSE_STATUS.check.color, HOUSE_STATUS.verified.color];
      map.addSource("my-polys", { type: "geojson", data: fc([]) });
      map.addSource("my-pts", { type: "geojson", data: fc([]) });
      map.addSource("sel", { type: "geojson", data: fc([]) });
      map.addLayer({ id: "my-fill", type: "fill", source: "my-polys", paint: { "fill-color": col, "fill-opacity": 0.45 } });
      map.addLayer({ id: "my-line", type: "line", source: "my-polys", paint: { "line-color": col, "line-width": 2 } });
      map.addLayer({ id: "sel-fill", type: "fill", source: "sel", paint: { "fill-color": "#0E1B24", "fill-opacity": 0.14 } });
      map.addLayer({ id: "sel-line", type: "line", source: "sel", paint: { "line-color": "#0E1B24", "line-width": 3 } });
      const vis = ["step", ["zoom"], 1, 16.5, ["case", ["get", "hasFoot"], 0, 1]];
      map.addLayer({ id: "my-dot", type: "circle", source: "my-pts", paint: {
        "circle-radius": ["interpolate", ["linear"], ["zoom"], 12, 3, 16, 6, 19, 10], "circle-color": col,
        "circle-stroke-color": "#ffffff", "circle-stroke-width": 2, "circle-opacity": vis, "circle-stroke-opacity": vis } });
      if (!map.getLayer("my-dot")) console.error("my-dot layer missing");
      setReady(true);
    });
    map.on("click", e => clickRef.current && clickRef.current(e));
    map.on("moveend", () => {
      const c = map.getCenter();
      try { localStorage.setItem(VIEW_KEY, JSON.stringify({ lat: c.lat, lng: c.lng, zoom: map.getZoom() })); } catch (e) { }
      renderLabels();
    });
    const ro = new ResizeObserver(() => map.resize()); ro.observe(box.current);
    return () => { clearTimeout(loadTimer); ro.disconnect(); labelsRef.current.forEach(m => m.remove()); map.remove(); };
  }, []);

  /* ---- עדכון השכבה הפרטית ---- */
  useEffect(() => {
    const map = mapRef.current; if (!ready || !map) return;
    map.getSource("my-polys").setData(fc(houses.filter(h => h.ring).map(h => ({ type: "Feature", properties: { key: h.key, status: h.status }, geometry: { type: "Polygon", coordinates: [h.ring] } }))));
    map.getSource("my-pts").setData(fc(houses.map(h => ({ type: "Feature", properties: { key: h.key, status: h.status, hasFoot: !!h.ring }, geometry: { type: "Point", coordinates: [h.lng, h.lat] } }))));
    renderLabelsRef.current();
  }, [ready, houses]);

  useEffect(() => {
    const map = mapRef.current; if (!ready || !map) return;
    imgRef.current = { ok: false, errs: 0 };
    try { applyBase(map, base, imgKey); } catch (e) { console.warn(e); }
  }, [ready, base, imgKey]);
  useEffect(() => { if (imgFailed && base === "img") { setBaseS("map"); lsSet(BASE_KEY, "map"); setKeyModal(true); } }, [imgFailed]);
  const saveKey = k => { lsSet(IMG_KEY, k); setImgKey(k); setKeyModal(false); setImgFailed(false); if (k) { setBaseS("img"); lsSet(BASE_KEY, "img"); } else { setBaseS("map"); lsSet(BASE_KEY, "map"); } };
  const baseToggle = html`<div className="seg hm-base" role="group" aria-label="שכבת רקע">
    <button aria-pressed=${base === "map"} onClick=${() => setBase("map")}><${Icon} n="map"/>מפה</button>
    <button aria-pressed=${base === "img"} onClick=${() => setBase("img")}><${Icon} n="photo"/>תצלום אוויר</button>
  </div>`;

  const selHouse = sel && sel.kind === "house" ? houses.find(h => h.key === sel.key) : null;
  useEffect(() => { if (sel && sel.kind === "house" && !selHouse) setSel(null); }, [selHouse, sel]);
  useEffect(() => {
    const map = mapRef.current; if (!ready || !map) return;
    const ring = sel && sel.kind === "building" ? sel.ring : selHouse && selHouse.ring;
    map.getSource("sel").setData(ring ? fc([{ type: "Feature", properties: {}, geometry: { type: "Polygon", coordinates: [ring] } }]) : fc([]));
  }, [ready, sel, selHouse]);

  /* ---- זיהוי מבנה בלחיצה ---- */
  const buildingAt = (map, p, ll) => {
    const feats = map.queryRenderedFeatures([[p.x - 6, p.y - 6], [p.x + 6, p.y + 6]])
      .filter(f => f.layer && !/^(my-|sel-)/.test(f.layer.id) && (f.sourceLayer === "building" || /building/i.test(f.layer.id)));
    if (!feats.length) return null;
    const hit = feats.find(f => { const r = featureRing(f, ll); return r && pointInRing(ll, r); }) || feats[0];
    const ring = featureRing(hit, ll); if (!ring) return null;
    return { ring: simplifyRing(ring), center: ringCentroid(ring), osmRef: hit.id != null ? String(hit.id) : null, addr: addrNear(map, p) };
  };
  const addrNear = (map, p) => {
    try {
      const fs = map.queryRenderedFeatures([[p.x - 45, p.y - 45], [p.x + 45, p.y + 45]]);
      const hn = fs.find(f => f.sourceLayer === "housenumber" && f.properties && f.properties.housenumber);
      const st = fs.find(f => f.sourceLayer === "transportation_name" && f.properties && (f.properties["name:he"] || f.properties.name));
      return [st ? (st.properties["name:he"] || st.properties.name) : "", hn ? hn.properties.housenumber : ""].filter(Boolean).join(" ");
    } catch (e) { return ""; }
  };
  const houseAtRing = ring => housesRef.current.find(h => pointInRing([h.lng, h.lat], ring));
  const openHouse = (key, fly) => {
    setSel({ kind: "house", key }); setListOpen(false);
    const h = housesRef.current.find(x => x.key === key); const map = mapRef.current;
    if (fly && h && map) map.flyTo({ center: [h.lng, h.lat], zoom: Math.max(map.getZoom(), 18), duration: 700 });
  };
  openRef.current = openHouse;
  clickRef.current = e => {
    if (modeRef.current !== "browse") return;
    const map = mapRef.current; const p = e.point; const ll = [e.lngLat.lng, e.lngLat.lat];
    const mine = map.queryRenderedFeatures([[p.x - 12, p.y - 12], [p.x + 12, p.y + 12]], { layers: ["my-dot", "my-fill"] });
    if (mine.length) { openHouse(mine[0].properties.key); return; }
    const b = buildingAt(map, p, ll);
    if (b) { const h = houseAtRing(b.ring); if (h) openHouse(h.key); else setSel({ kind: "building", ...b }); return; }
    setSel({ kind: "empty", center: { lng: ll[0], lat: ll[1] } });
  };

  /* ---- פעולות ---- */
  const newDraft = addr => ({ firstName: "", lastName: "", phone: "", notes: "", address: addr || "", area: "" });
  const assignTo = ctx => { setFormErr(null); setForm({ isNew: true, ctx, draft: newDraft(ctx.addr) }); };
  const addFamily = h => { const f0 = h.families[0]; setFormErr(null); setForm({ isNew: true, ctx: { ring: h.ring, center: { lat: h.lat, lng: h.lng }, houseKey: h.key, status: h.status, osmRef: f0.osmRef || null }, draft: { ...newDraft(f0.address), area: f0.area || "" } }); };
  const editFamily = p => { setFormErr(null); setForm({ isNew: false, ctx: {}, draft: { ...p } }); };
  const openTaskIds = new Set(tasks.filter(t => t.status !== "done").map(t => t.id));
  const syncStops = async list => {
    const patches = [];
    list.forEach(p => stops.filter(s => s.personId === p.id && openTaskIds.has(s.taskId)).forEach(s => patches.push({ id: s.id, patch: { lat: p.lat, lng: p.lng, address: p.address || "", area: p.area || "", desc: p.notes || "" } })));
    if (patches.length) await Repo.updateStops(patches);
    return patches.length;
  };
  const saveForm = async () => {
    const d = form.draft;
    if (!d.firstName.trim() || !d.lastName.trim()) { setFormErr("צריך למלא שם פרטי ושם משפחה."); return; }
    setSaving(true);
    try {
      if (form.isNew) {
        const id = uid("p"), ctx = form.ctx;
        const person = {
          id, firstName: d.firstName.trim(), lastName: d.lastName.trim(), phone: (d.phone || "").trim(), notes: (d.notes || "").trim(),
          address: (d.address || "").trim(), area: (d.area || "").trim(),
          lat: +ctx.center.lat.toFixed(6), lng: +ctx.center.lng.toFixed(6),
          footprint: ctx.ring ? flatRing(ctx.ring) : null, osmRef: ctx.osmRef || null,
          houseKey: ctx.houseKey || "h" + id.slice(1), houseStatus: ctx.status || "verified", createdAt: Date.now(),
        };
        await Repo.savePerson(person);
        toast(`משפחת ${person.lastName} נשמרה`);
        setSel({ kind: "house", key: person.houseKey });
      } else {
        const p = { ...d, firstName: d.firstName.trim(), lastName: d.lastName.trim(), phone: (d.phone || "").trim(), notes: (d.notes || "").trim() };
        await Repo.savePerson(p);
        const n = await syncStops([p]);
        toast(n ? `נשמר · עודכן גם ב-${n} עצירות פתוחות` : "השינויים נשמרו");
      }
      setForm(null);
    } catch (e) { }
    setSaving(false);
  };
  const deleteFamily = async () => { const p = form.draft; await Repo.deletePerson(p.id); toast(`משפחת ${p.lastName} נמחקה מהמאגר`); setForm(null); };
  const setStatus = async (h, st) => { await runAll(h.families.map(f => () => STORE.set("people", f.id, { ...f, houseStatus: st })), 4).catch(failToast); };
  const startAdd = key => { setSel(null); setListOpen(false); setMoveKey(key || null); setMode("add"); };
  const confirmAdd = async () => {
    const map = mapRef.current; const c = map.getCenter(); const p = map.project(c); const ll = [c.lng, c.lat];
    const b = buildingAt(map, p, ll);
    setMode("browse");
    if (moveKey) {
      const h = housesRef.current.find(x => x.key === moveKey); setMoveKey(null); if (!h) return;
      const center = b ? b.center : { lat: c.lat, lng: c.lng };
      const moved = h.families.map(f => ({ ...f, lat: +center.lat.toFixed(6), lng: +center.lng.toFixed(6), footprint: b ? flatRing(b.ring) : null, osmRef: b ? b.osmRef : null }));
      try { await runAll(moved.map(f => () => STORE.set("people", f.id, f)), 4); const n = await syncStops(moved); toast(n ? `המיקום עודכן · גם ב-${n} עצירות פתוחות` : "המיקום עודכן"); openHouse(h.key); } catch (e) { failToast(e); }
      return;
    }
    if (b) { const h = houseAtRing(b.ring); if (h) { openHouse(h.key); toast("המבנה הזה כבר משויך"); return; } setSel({ kind: "building", ...b }); assignTo(b); }
    else assignTo({ center: { lat: c.lat, lng: c.lng }, ring: null, addr: addrNear(map, p) });
  };
  const locate = () => { const g = geoRef.current; if (!g) return; setLocating(true); try { g.trigger(); } catch (e) { setLocating(false); } setTimeout(() => setLocating(false), 16000); };

  /* ---- חיפוש ורשימה ---- */
  const results = useMemo(() => {
    const n = norm(q); if (!n) return [];
    return people.filter(p => p.lat != null && (norm(fullName(p)).includes(n) || norm(p.lastName).includes(n) || norm(p.address).includes(n) || (p.phone || "").replace(/\D/g, "").includes(n.replace(/\D/g, "") || "#"))).slice(0, 8);
  }, [q, people]);
  const listHouses = useMemo(() => houses.filter(h => listF === "all" || h.status === listF)
    .sort((a, b) => a.families[0].lastName.localeCompare(b.families[0].lastName, "he")), [houses, listF]);
  const checkCount = houses.filter(h => h.status === "check").length;

  if (mapErr) return html`<div className="page" style=${{ padding: "16px" }}><div className="banner warn"><${Icon} n="alert"/><span className="grow">${mapErr}</span></div></div>`;
  return html`<div className=${"hmap base-" + base}>
    <div ref=${box} className="hmap-canvas" dir="ltr"></div>
    ${!ready && html`<div className="hm-loading">טוען מפה…</div>`}

    ${mode === "add" ? html`
      <div className="hm-cross" aria-hidden="true"><span></span></div>
      <div className="hm-top"><div className="hm-hint">${moveKey ? "הזז את המפה עד שהסמן על המיקום החדש, ואז \"שמור כאן\"" : "הזז את המפה עד שהסמן על הבית, ואז \"שמור כאן\""}</div></div>
      ${baseToggle}
      <div className="hm-bar">
        <button className="b b-sec b-lg" onClick=${() => { setMode("browse"); setMoveKey(null); }}>ביטול</button>
        <button className="b b-primary b-lg" onClick=${confirmAdd}><${Icon} n="pin"/>שמור כאן</button>
      </div>
      <button className="hm-gps" onClick=${locate} aria-label="המיקום שלי"><${Icon} n="target"/></button>` : html`
      <div className="hm-top">
        <div className="hm-search">
          <${Icon} n="search"/>
          <input id="hm-q" type="search" value=${q} placeholder="חיפוש משפחה" autoComplete="off" onChange=${e => setQ(e.target.value)} onFocus=${() => setQFocus(true)} onBlur=${() => setTimeout(() => setQFocus(false), 150)}/>
          ${q && html`<button className="hm-clear" onClick=${() => setQ("")} aria-label="נקה חיפוש"><${Icon} n="x"/></button>`}
        </div>
        <button className=${"hm-sq" + (listOpen ? " on" : "")} onClick=${() => { setListOpen(v => !v); setSel(null); }} aria-label="רשימת בתים"><${Icon} n="list"/></button>
      </div>
      ${!(qFocus && q) && !listOpen && baseToggle}
      ${qFocus && q && html`<div className="hm-results">
        ${results.length === 0 && html`<div className="empty">לא נמצאה משפחה</div>`}
        ${results.map(p => html`<button key=${p.id} className="prow" onMouseDown=${e => e.preventDefault()} onClick=${() => { setQ(""); openHouse(p.houseKey || p.id, true); }}>
          <span className="av">${p.lastName[0]}</span><span className="pm"><b>${fullName(p)}</b><small>${p.address || "ללא כתובת"}${p.phone ? " · " + p.phone : ""}</small></span></button>`)}
      </div>`}
      ${!sel && !listOpen && html`
        <button className="hm-gps" onClick=${locate} aria-label="המיקום שלי">${locating ? html`<span className="spin"></span>` : html`<${Icon} n="target"/>`}</button>
        <div className="hm-bottom">
          <span className="hm-count num">${houses.length} בתים · ${people.filter(p => p.lat != null).length} משפחות</span>
          <button className="hm-add" onClick=${() => startAdd(null)}><${Icon} n="plus"/>הוסף בית</button>
        </div>`}
    `}

    ${mode === "browse" && sel && html`<div className="hsheet" role="dialog" aria-label="פרטי מבנה">
      <div className="grab"></div>
      <button className="x-btn hs-x" onClick=${() => setSel(null)} aria-label="סגירה"><${Icon} n="x"/></button>
      ${sel.kind === "building" && html`
        <div className="hs-head"><span className="hs-ic free"><${Icon} n="home"/></span><div className="t"><h3>בית לא משויך</h3><span>${sel.addr || "מבנה מ-OpenStreetMap"}</span></div></div>
        <button className="b b-primary b-lg b-block" onClick=${() => assignTo(sel)}><${Icon} n="users"/>שייך למשפחה</button>`}
      ${sel.kind === "empty" && html`
        <div className="hs-head"><span className="hs-ic free"><${Icon} n="pin"/></span><div className="t"><h3>לא זוהה מבנה כאן</h3><span>אם הבית לא מופיע במפה, אפשר לסמן אותו כנקודה.</span></div></div>
        <button className="b b-primary b-lg b-block" onClick=${() => assignTo({ center: sel.center, ring: null, addr: "" })}><${Icon} n="pin"/>סמן בית בנקודה הזו</button>`}
      ${selHouse && html`
        <div className="hs-head"><span className=${"hs-ic " + selHouse.status}><${Icon} n="home"/></span>
          <div className="t"><h3>${houseTitle(selHouse)}</h3><span>${selHouse.families[0].address || (selHouse.ring ? "מבנה משויך" : "נקודה במפה")}</span></div></div>
        <div className="hs-fams">${selHouse.families.map(f => html`<div key=${f.id} className="hs-fam">
          <div className="m"><b>${fullName(f)}</b>
            ${f.phone && html`<span className="num">${f.phone}</span>`}
            ${f.notes && html`<span>${f.notes}</span>`}</div>
          <button className="b b-sec b-sm" onClick=${() => editFamily(f)}>ערוך</button></div>`)}</div>
        <div className="seg full" role="group" aria-label="סטטוס הבית">
          ${Object.entries(HOUSE_STATUS).map(([k, v]) => html`<button key=${k} aria-pressed=${selHouse.status === k} onClick=${() => selHouse.status !== k && setStatus(selHouse, k)}><i className="dot" style=${{ background: v.color }}></i>${v.label}</button>`)}
        </div>
        <div className="row-actions">
          <button className="b b-sec" onClick=${() => addFamily(selHouse)}><${Icon} n="plus"/>משפחה נוספת</button>
          <button className="b b-sec" onClick=${() => startAdd(selHouse.key)}><${Icon} n="pin"/>הזז מיקום</button>
        </div>`}
    </div>`}

    ${listOpen && mode === "browse" && html`<div className="hlist">
      <div className="hlist-head"><h3>בתים משויכים <span className="lbl num">${houses.length}</span></h3>
        <div className="seg"><button aria-pressed=${listF === "all"} onClick=${() => setListF("all")}>הכל</button><button aria-pressed=${listF === "check"} onClick=${() => setListF("check")}><span className="num">לבדיקה · ${checkCount}</span></button></div></div>
      <div className="hlist-body">
        ${listHouses.length === 0 && html`<div className="empty">אין בתים ברשימה הזו</div>`}
        ${listHouses.map(h => html`<button key=${h.key} className="prow" onClick=${() => openHouse(h.key, true)}>
          <span className="av" style=${{ background: h.status === "check" ? "var(--retry-soft)" : "var(--accent-soft)", color: h.status === "check" ? "var(--retry)" : "var(--accent)" }}><${Icon} n="home"/></span>
          <span className="pm"><b>${houseTitle(h)}</b><small>${h.families.map(f => f.firstName).join(", ")}${h.families[0].address ? " · " + h.families[0].address : ""}</small></span>
          <${Icon} n="next"/></button>`)}
      </div>
    </div>`}

    ${keyModal && html`<${ImageryKeyModal} current=${imgKey} failed=${imgFailed} onSave=${saveKey} onClose=${() => setKeyModal(false)}/>`}
    ${form && html`<${FamilyForm} form=${form} setForm=${setForm} onSave=${saveForm} onDelete=${!form.isNew ? deleteFamily : null} saving=${saving} error=${formErr}/>`}
  </div>`;
}

/* ---------- 7. admin ----------
   מובייל תחילה: בטלפון — כרטיסים, ניווט תחתון, חלונות במסך מלא.
   מ-761px ומעלה טבלאות; מ-1024px סרגל צד. הלוגיקה זהה בכל הגדלים. */
function useCourierMap(couriers) { return useMemo(() => Object.fromEntries((couriers || []).map(c => [c.id, c])), [couriers]); }
const CDot = ({ c }) => c ? html`<span className="cdot"><i style=${{ background: c.color }}></i>${c.name}</span>` : null;

function StatusBar({ c }) {
  const w = k => c.total ? (c[k] / c.total * 100) + "%" : "0";
  return html`<div className="bar" title=${`${c.delivered} נמסרו · ${c.retry} ניסיון נוסף · ${c.failed} בעיה · ${c.pending} ממתינים`}>
    <i style=${{ width: w("delivered"), background: "var(--ok)" }}></i><i style=${{ width: w("retry"), background: "var(--retry)" }}></i><i style=${{ width: w("failed"), background: "var(--fail)" }}></i></div>`;
}

function Modal({ title, sub, onClose, children, foot, size }) {
  useEffect(() => { const h = e => { if (e.key === "Escape") onClose(); }; window.addEventListener("keydown", h); return () => window.removeEventListener("keydown", h); }, [onClose]);
  return html`<div className="modal-scrim" onMouseDown=${e => { if (e.target === e.currentTarget) onClose(); }}>
    <div className=${"modal " + (size || "")} role="dialog" aria-modal="true" aria-label=${title}>
      <div className="modal-head"><div className="t"><h2>${title}</h2>${sub && html`<div className="sub">${sub}</div>`}</div>
        <button className="x-btn" onClick=${onClose} aria-label="סגירה"><${Icon} n="x"/></button></div>
      <div className="modal-body">${children}</div>
      ${foot && html`<div className="modal-foot">${foot}</div>`}
    </div></div>`;
}

function ConfirmButton({ label, confirmLabel, onConfirm, className = "b b-danger b-sm", icon }) {
  const [armed, setArmed] = useState(false);
  useEffect(() => { if (!armed) return; const t = setTimeout(() => setArmed(false), 4000); return () => clearTimeout(t); }, [armed]);
  return html`<button className=${className + (armed ? " armed" : "")} onClick=${() => armed ? (setArmed(false), onConfirm()) : setArmed(true)}>
    ${icon && html`<${Icon} n=${icon}/>`}<span>${armed ? confirmLabel : label}</span></button>`;
}
const whenText = ts => isToday(ts) ? hhmm(ts) : fmtTs(ts);

/* ===== לוח בקרה ===== */
function Dashboard({ tasks, stops, couriers, go, onNew, mobile }) {
  const cmap = useCourierMap(couriers);
  const byTask = useMemo(() => groupBy(stops, "taskId"), [stops]);
  const rows = useMemo(() => tasks.map(t => { const c = statsOf(byTask[t.id] || []); return { t, c, phase: phaseOf(t, c) }; })
    .sort((a, b) => (b.t.date || "").localeCompare(a.t.date || "") || b.t.number - a.t.number), [tasks, byTask]);
  const activeIds = new Set(rows.filter(r => r.phase === "active").map(r => r.t.id));
  const kpi = {
    active: activeIds.size,
    today: stops.filter(s => s.status === "delivered" && isToday(s.deliveredAt)).length,
    open: stops.filter(s => activeIds.has(s.taskId) && s.status !== "delivered").length,
    couriers: new Set(stops.filter(s => activeIds.has(s.taskId) && s.courierId).map(s => s.courierId)).size,
    finished: rows.filter(r => r.phase === "finished" || r.phase === "done").length,
  };
  const taskById = Object.fromEntries(tasks.map(t => [t.id, t]));
  const feed = stops.filter(s => s.updatedAt && taskById[s.taskId]).sort((a, b) => b.updatedAt - a.updatedAt).slice(0, mobile ? 6 : 9);
  const problems = c => c.failed + c.retry;
  return html`<div className="page">
    <div className="page-head">
      <div><h1>לוח בקרה</h1><div className="sub">${new Date().toLocaleDateString("he-IL", { weekday: "long", day: "numeric", month: "long" })}</div></div>
      ${!mobile && html`<button className="b b-primary b-lg" onClick=${onNew}><${Icon} n="plus"/>משימת חלוקה חדשה</button>`}
    </div>
    <div className="kpis num">
      <div className="kpi ok wide"><span>הזמנות שנמסרו היום</span><b>${kpi.today}</b></div>
      <div className="kpi info"><b>${kpi.active}</b><span>משימות פעילות</span></div>
      <div className="kpi warn"><b>${kpi.open}</b><span>עדיין לא נמסרו</span></div>
      <div className="kpi"><b>${kpi.couriers}</b><span>שליחים פעילים</span></div>
      <div className="kpi"><b>${kpi.finished}</b><span>משימות שהסתיימו</span></div>
    </div>
    ${mobile && html`<button className="b b-primary b-lg b-block" onClick=${onNew}><${Icon} n="plus"/>משימת חלוקה חדשה</button>`}
    <div className="dash-grid">
      ${mobile ? html`<section className="stack">
          <div className="sec-title"><h2>משימות חלוקה</h2><span className="lbl num">${tasks.length}</span></div>
          ${rows.length === 0 && html`<div className="panel empty-note">אין עדיין משימות. צור משימת חלוקה חדשה כדי להתחיל.</div>`}
          <div className="cards">${rows.map(({ t, c, phase }) => html`<button key=${t.id} className="tcard" onClick=${() => go({ page: "task", id: t.id })}>
            <div className="tcard-top"><div className="t"><b>${t.eventName}</b><span className="s num">#${t.number} · ${fmtDate(t.date)}</span></div>
              <span className=${"pill " + phase}>${PHASE_LABEL[phase]}${phase === "locating" ? ` (${c.unlocated})` : ""}</span></div>
            <${StatusBar} c=${c}/>
            <div className="tcard-foot">
              <div className="tcard-stats num"><span><b style=${{ color: "var(--ok)" }}>${c.delivered}</b>/${c.total} נמסרו</span>${problems(c) ? html`<span><b style=${{ color: "var(--fail)" }}>${problems(c)}</b> לא נמסרו</span>` : null}</div>
              <div className="cdots">${c.couriers.map(id => html`<${CDot} key=${id} c=${cmap[id]}/>`)}</div>
            </div>
          </button>`)}</div>
        </section>` : html`<section className="panel">
        <div className="panel-head"><h2>משימות חלוקה</h2><span className="lbl num">${tasks.length} משימות</span></div>
        <div className="tbl-wrap"><table className="tbl">
          <thead><tr><th>שם אירוע</th><th>תאריך</th><th>הזמנות</th><th>נמסרו</th><th>לא נמסרו</th><th>שליחים</th><th>התקדמות</th><th>סטטוס</th></tr></thead>
          <tbody>
            ${rows.length === 0 && html`<tr><td colSpan="8"><div className="empty-note">אין עדיין משימות. צור משימת חלוקה חדשה כדי להתחיל.</div></td></tr>`}
            ${rows.map(({ t, c, phase }) => html`<tr key=${t.id} className="click" onClick=${() => go({ page: "task", id: t.id })}>
              <td><div className="t-name">${t.eventName}</div><div className="t-sub num">משימה #${t.number}</div></td>
              <td className="n">${fmtDate(t.date)}</td>
              <td className="n" style=${{ fontWeight: 600 }}>${c.total}</td>
              <td className="n" style=${{ color: "var(--ok)", fontWeight: 600 }}>${c.delivered}</td>
              <td className="n" style=${{ color: problems(c) ? "var(--fail)" : "var(--ink-3)", fontWeight: 600 }} title=${`${c.failed} בעיה · ${c.retry} ניסיון נוסף`}>${problems(c)}</td>
              <td><div className="cdots">${c.couriers.length ? c.couriers.map(id => html`<${CDot} key=${id} c=${cmap[id]}/>`) : html`<span className="muted">—</span>`}</div></td>
              <td style=${{ minWidth: "110px" }}><${StatusBar} c=${c}/></td>
              <td><span className=${"pill " + phase}>${PHASE_LABEL[phase]}${phase === "locating" ? ` (${c.unlocated})` : ""}</span></td>
            </tr>`)}
          </tbody></table></div>
      </section>`}
      <section className="panel">
        <div className="panel-head"><h2>עדכונים מהשטח</h2><span className="live"><i></i>בזמן אמת</span></div>
        <div className="feed">
          ${feed.length === 0 && html`<div className="empty-note">עדכוני השליחים יופיעו כאן</div>`}
          ${feed.map(s => { const cr = cmap[s.courierId]; return html`<button key=${s.id} onClick=${() => go({ page: "task", id: s.taskId, tab: "track" })}>
            <${SBadge} s=${s.status} iconOnly/>
            <div className="f-main"><b>${s.firstName} ${s.lastName}</b> · ${STATUS_LABEL[s.status]}${s.reason ? ` · ${REASON_LABEL[s.reason]}` : ""}
              <div className="f-time">${cr ? cr.name + " · " : ""}#${taskById[s.taskId].number} · ${whenText(s.updatedAt)}</div></div>
          </button>`; })}
        </div>
      </section>
    </div>
  </div>`;
}

/* ===== יצירת משימה ===== */
const CSV_HEADER = "שם פרטי,שם משפחה,טלפון,אזור,כתובת או תיאור הבית";
function NewTaskModal({ people, tasks, onClose, onCreated }) {
  const [step, setStep] = useState(1);
  const [info, setInfo] = useState({ eventName: "", date: todayISO(), expected: "" });
  const [guests, setGuests] = useState([]);
  const [mode, setMode] = useState("csv");
  const [csvText, setCsvText] = useState("");
  const [csvMsg, setCsvMsg] = useState(null);
  const [over, setOver] = useState(false);
  const empty = { firstName: "", lastName: "", phone: "", area: "", address: "" };
  const [manual, setManual] = useState(empty);
  const [busy, setBusy] = useState(null);
  const firstRef = useRef(null);
  const infoOk = info.eventName.trim() && info.date;
  const expected = +info.expected || 0;

  const applyCsv = text => { const r = parseGuestsCsv(text); if (r.error) setCsvMsg({ err: r.error }); else { setGuests(r.rows); setCsvMsg({ ok: `נקראו ${r.rows.length} מוזמנים${r.skipped ? `, ${r.skipped} שורות דולגו (חסר שם)` : ""}.` }); } };
  const onFile = f => { if (!f) return; readText(f).then(t => { setCsvText(t); applyCsv(t); }); };
  const addManual = e => { e.preventDefault(); if (!manual.firstName.trim() || !manual.lastName.trim()) return; setGuests(g => [...g, { ...manual }]); setManual({ ...empty, area: manual.area }); firstRef.current && firstRef.current.focus(); };
  const loadSample = () => { setGuests(VILLAGE.sample.map(g => ({ ...g }))); setCsvMsg({ ok: "נטענו 20 מוזמנים לדוגמה (נתוני דמה)." }); if (!info.expected) setInfo(i => ({ ...i, expected: "20" })); };
  const create = async () => {
    setBusy({ d: 0, t: guests.length + 1 });
    const number = Math.max(1000, ...tasks.map(t => t.number || 0)) + 1;
    const id = "t" + number + "-" + Math.random().toString(36).slice(2, 6);
    const task = { id, number, eventName: info.eventName.trim(), client: "", date: info.date, expected: expected || guests.length, status: "draft", createdAt: Date.now() };
    const stops = guests.map((g, i) => stopFromGuest(g, i, id, people));
    try { await Repo.createTask(task, stops, (d, t) => setBusy({ d: d + 1, t: t + 1 })); onCreated(id, stops); } catch (e) { setBusy(null); }
  };
  const setF = (k, v) => setManual(m => ({ ...m, [k]: v }));

  const foot = step === 1 ? html`
      <div className="info">שלב 1 מתוך 2 · פרטי האירוע</div>
      <div className="btns"><button className="b b-sec" onClick=${onClose}>ביטול</button>
        <button className="b b-primary" disabled=${!infoOk} onClick=${() => setStep(2)}>המשך למוזמנים</button></div>` : html`
      <div className="info num">${busy ? html`<div style=${{ display: "flex", flexDirection: "column", gap: "6px" }}>יוצר משימה ומחפש התאמות במאגר… ${busy.d}/${busy.t}<div className="progress-line"><i style=${{ width: (busy.d / busy.t * 100) + "%" }}></i></div></div>`
        : `שלב 2 מתוך 2 · ${guests.length} מוזמנים${expected && expected !== guests.length ? ` (צוינו ${expected})` : ""}`}</div>
      <div className="btns"><button className="b b-sec" onClick=${() => setStep(1)} disabled=${!!busy}>חזרה</button>
        <button className="b b-primary" disabled=${!guests.length || !!busy} onClick=${create}>צור משימה</button></div>`;

  return html`<${Modal} title="משימת חלוקה חדשה" sub=${step === 1 ? "פרטי האירוע" : info.eventName} onClose=${busy ? () => { } : onClose} foot=${foot}>
    ${step === 1 ? html`<div className="form" style=${{ maxWidth: "520px" }}>
      <div className="f"><label for="nt-name">שם האירוע / הלקוח <span className="req">*</span></label>
        <input id="nt-name" value=${info.eventName} placeholder="לדוגמה: חתונת עלי ונור" onChange=${e => setInfo({ ...info, eventName: e.target.value })}/></div>
      <div className="fgrid">
        <div className="f"><label for="nt-date">תאריך החלוקה <span className="req">*</span></label>
          <input id="nt-date" type="date" value=${info.date} onChange=${e => setInfo({ ...info, date: e.target.value })}/></div>
        <div className="f"><label for="nt-count">מספר הזמנות</label>
          <input id="nt-count" type="number" min="1" inputMode="numeric" value=${info.expected} placeholder="לפי הרשימה" onChange=${e => setInfo({ ...info, expected: e.target.value })}/></div>
      </div>
    </div>` : html`<div className="two">
      <div className="form">
        <button className="b b-sec b-block" onClick=${loadSample}>טען 20 מוזמנים לדוגמה</button>
        <div className="seg full" role="tablist">
          <button role="tab" aria-selected=${mode === "csv"} onClick=${() => setMode("csv")}>העלאת CSV</button>
          <button role="tab" aria-selected=${mode === "manual"} onClick=${() => setMode("manual")}>הזנה ידנית</button>
        </div>
        ${mode === "csv" ? html`
          <label className=${"drop" + (over ? " over" : "")} onDragOver=${e => { e.preventDefault(); setOver(true); }} onDragLeave=${() => setOver(false)}
            onDrop=${e => { e.preventDefault(); setOver(false); onFile(e.dataTransfer.files[0]); }}>
            <${Icon} n="upload"/><b>בחר קובץ CSV</b>
            <small>שמור מאקסל כ-CSV. גם קובץ בקידוד עברית של Windows ייקרא.</small>
            <input id="nt-file" type="file" accept=".csv,.txt,text/csv" hidden onChange=${e => { onFile(e.target.files[0]); e.target.value = ""; }}/>
          </label>
          <div className="f"><label for="nt-paste">או הדבק שורות</label>
            <textarea id="nt-paste" rows="4" value=${csvText} placeholder=${CSV_HEADER} onChange=${e => setCsvText(e.target.value)}></textarea></div>
          <button className="b b-sec" disabled=${!csvText.trim()} onClick=${() => applyCsv(csvText)}>קרא את הטקסט</button>
          ${csvMsg && (csvMsg.err ? html`<div className="err">${csvMsg.err}</div>` : html`<div className="banner ok"><${Icon} n="check"/><span className="grow">${csvMsg.ok}</span></div>`)}
          <div className="f"><label>שורת כותרת מומלצת</label><div className="codeline">${CSV_HEADER}</div></div>` : html`
          <form className="form" onSubmit=${addManual}>
            <div className="fgrid">
              <div className="f"><label for="m-first">שם פרטי <span className="req">*</span></label><input id="m-first" ref=${firstRef} value=${manual.firstName} onChange=${e => setF("firstName", e.target.value)}/></div>
              <div className="f"><label for="m-last">שם משפחה <span className="req">*</span></label><input id="m-last" value=${manual.lastName} onChange=${e => setF("lastName", e.target.value)}/></div>
              <div className="f"><label for="m-phone">טלפון</label><input id="m-phone" type="tel" inputMode="tel" value=${manual.phone} onChange=${e => setF("phone", e.target.value)}/></div>
              <div className="f"><label for="m-area">אזור / שכונה</label><input id="m-area" list="areas-dl" value=${manual.area} onChange=${e => setF("area", e.target.value)}/></div>
              <div className="f full"><label for="m-addr">כתובת או תיאור הבית</label><input id="m-addr" value=${manual.address} onChange=${e => setF("address", e.target.value)}/></div>
            </div>
            <button className="b b-sec" type="submit" disabled=${!manual.firstName.trim() || !manual.lastName.trim()}><${Icon} n="plus"/>הוסף לרשימה</button>
          </form>`}
      </div>
      <div className="form">
        <div className="sec-title"><h2>רשימת המוזמנים <span className="lbl num">${guests.length}${expected ? `/${expected}` : ""}</span></h2>
          ${guests.length > 0 && html`<button className="b b-ghost b-sm" onClick=${() => setGuests([])}>נקה</button>`}</div>
        ${expected > 0 && guests.length > 0 && expected !== guests.length && html`<div className="banner warn"><${Icon} n="alert"/><span className="grow">ברשימה ${guests.length} מוזמנים, וצוינו ${expected} הזמנות. אפשר להמשיך בכל זאת.</span></div>`}
        <div className="gl">
          ${guests.length === 0 ? html`<div className="empty-note">עוד לא נוספו מוזמנים</div>` :
            guests.map((g, i) => html`<div key=${i} className="grow-row"><span className="lbl num" style=${{ width: "22px" }}>${i + 1}</span>
              <span className="m"><b>${g.firstName} ${g.lastName}</b><span>${[g.area, g.address, g.phone].filter(Boolean).join(" · ") || "ללא פרטי מיקום"}</span></span>
              <button className="x-btn" aria-label=${`הסר את ${g.firstName} ${g.lastName}`} onClick=${() => setGuests(guests.filter((_, j) => j !== i))}><${Icon} n="x"/></button></div>`)}
        </div>
      </div>
    </div>`}
    <datalist id="areas-dl">${VILLAGE.areas.map(a => html`<option key=${a.name} value=${a.name}/>`)}</datalist>
  <//>`;
}

/* ===== טופס אדם (משותף למאגר ולמיקום מוזמן חדש) ===== */
function PersonForm({ draft, setDraft, onSave, onCancel, onDelete, saving, isNew, error, extra }) {
  const set = (k, v) => setDraft(d => ({ ...d, [k]: v }));
  const located = draft.lat != null;
  return html`<form className="form" onSubmit=${e => { e.preventDefault(); onSave(); }}>
    <div className=${"loc " + (located ? "set" : "unset")}><${Icon} n="pin"/>
      ${located ? html`<span className="num">מיקום נקבע. אפשר לגרור את הנקודה או ללחוץ במקום אחר במפה.</span>` : html`<span>לחץ על המפה כדי לקבוע את מיקום הבית</span>`}</div>
    <div className="fgrid">
      <div className="f"><label for="p-first">שם פרטי <span className="req">*</span></label><input id="p-first" value=${draft.firstName} onChange=${e => set("firstName", e.target.value)}/></div>
      <div className="f"><label for="p-last">שם משפחה <span className="req">*</span></label><input id="p-last" value=${draft.lastName} onChange=${e => set("lastName", e.target.value)}/></div>
      <div className="f"><label for="p-phone">טלפון</label><input id="p-phone" type="tel" inputMode="tel" value=${draft.phone || ""} onChange=${e => set("phone", e.target.value)}/></div>
      <div className="f"><label for="p-area">אזור / שכונה</label><input id="p-area" list="areas-dl2" value=${draft.area || ""} onChange=${e => set("area", e.target.value)}/></div>
      <div className="f full"><label for="p-addr">כתובת</label><input id="p-addr" value=${draft.address || ""} onChange=${e => set("address", e.target.value)}/></div>
      <div className="f full"><label for="p-notes">תיאור הבית (מוצג לשליח)</label><textarea id="p-notes" value=${draft.notes || ""} placeholder="לדוגמה: שער ירוק, מול המכולת" onChange=${e => set("notes", e.target.value)}></textarea></div>
    </div>
    ${!isNew && html`<div className="meta num"><span>מזהה: ${draft.id}</span><span>נוצר: ${fmtTs(draft.createdAt)}</span>${located ? html`<span>${draft.lat.toFixed(5)}, ${draft.lng.toFixed(5)}</span>` : null}</div>`}
    ${extra}
    ${error && html`<div className="err">${error}</div>`}
    <div className="form-actions">
      <button className="b b-primary b-lg" type="submit" disabled=${saving}>${saving ? "שומר…" : isNew ? "שמור במאגר" : "שמור שינויים"}</button>
      <button className="b b-sec" type="button" onClick=${onCancel}>ביטול</button>
      ${onDelete ? html`<${ConfirmButton} className="b b-danger" label="מחק" confirmLabel="לחץ שוב למחיקה" icon="trash" onConfirm=${onDelete}/>` : html`<span></span>`}
    </div>
    <datalist id="areas-dl2">${VILLAGE.areas.map(a => html`<option key=${a.name} value=${a.name}/>`)}</datalist>
  </form>`;
}
function validatePerson(d) {
  if (!d.firstName.trim() || !d.lastName.trim()) return "חסר שם פרטי או שם משפחה.";
  if (d.lat == null) return "עוד לא נקבע מיקום. לחץ על המפה במקום הבית.";
  return null;
}
const peoplePoints = (people, excludeId) => people.filter(p => p.id !== excludeId && p.lat != null)
  .map(p => ({ id: p.id, lat: p.lat, lng: p.lng, size: 12, html: mk("#5C6C76", "", "faint"), title: fullName(p) }));

/* ===== מיקום מוזמן שלא נמצא במאגר ===== */
function LocateModal({ stop, people, onClose }) {
  const [draft, setDraft] = useState({ firstName: stop.firstName, lastName: stop.lastName, phone: stop.phone || "", area: stop.listArea || "", address: stop.listAddress || "", notes: "", lat: null, lng: null });
  const [saving, setSaving] = useState(false), [error, setError] = useState(null);
  const area = VILLAGE.areas.find(a => a.name === (stop.listArea || "").trim());
  const [focus] = useState(() => area ? { lat: area.at[0], lng: area.at[1], key: "a", zoom: 17 } : null);
  const points = useMemo(() => [...peoplePoints(people),
    ...(draft.lat != null ? [{ id: "__new", lat: draft.lat, lng: draft.lng, size: 32, z: 1000, draggable: true, html: mk("#2563D9", "", "new"), noFit: true }] : [])], [people, draft.lat, draft.lng]);
  const save = async () => {
    const err = validatePerson(draft); if (err) { setError(err); return; }
    setSaving(true);
    const person = { ...draft, id: uid("p"), createdAt: Date.now() };
    try { await Repo.savePerson(person); await Repo.updateStop(stop.id, { ...linkFields(person, stop), manual: true }); toast(`${fullName(person)} נוסף למאגר וקיבל מיקום`); onClose(); } catch (e) { setSaving(false); }
  };
  return html`<${Modal} title=${`מיקום: ${stop.firstName} ${stop.lastName}`} sub=${"מהרשימה: " + ([stop.listArea, stop.listAddress].filter(Boolean).join(" · ") || "ללא פרטי כתובת")} onClose=${onClose}>
    <div className="locate">
      <${LMap} points=${points} fitKey=${area ? null : "all"} focus=${focus} placing hint=${draft.lat == null ? "לחץ על מיקום הבית במפה" : null}
        onMapClick=${ll => { setDraft(d => ({ ...d, ...ll })); setError(null); }} onMarkerDrag=${(id, ll) => id === "__new" && setDraft(d => ({ ...d, ...ll }))}/>
      <${PersonForm} draft=${draft} setDraft=${setDraft} isNew saving=${saving} error=${error} onSave=${save} onCancel=${onClose}/>
    </div>
  <//>`;
}

/* ===== שיוך ידני לרשומה קיימת ===== */
function LinkModal({ stop, people, onClose }) {
  const [q, setQ] = useState(stop.lastName);
  const res = useMemo(() => { const n = norm(q); return people.filter(p => !n || norm(fullName(p)).includes(n) || norm(p.address).includes(n)).slice(0, 40); }, [q, people]);
  const pick = async p => { await Repo.updateStop(stop.id, { ...linkFields(p, stop), manual: true }); toast(`${stop.firstName} ${stop.lastName} שויך ל${fullName(p)}`); onClose(); };
  return html`<${Modal} size="sm" title=${`שיוך ידני: ${stop.firstName} ${stop.lastName}`} sub="בחר את הרשומה הנכונה במאגר" onClose=${onClose}>
    <div className="form">
      <div className="search"><${Icon} n="search"/><input id="link-q" value=${q} placeholder="חיפוש לפי שם, משפחה או כתובת" onChange=${e => setQ(e.target.value)}/></div>
      <div className="panel">
        ${res.length === 0 && html`<div className="empty-note">לא נמצאו רשומות</div>`}
        ${res.map(p => html`<button key=${p.id} className="prow" onClick=${() => pick(p)}>
          <span className="av">${p.firstName[0]}</span><span className="pm"><b>${fullName(p)}</b><small>${p.address} · ${p.area}</small></span><${Icon} n="next"/></button>`)}
      </div>
    </div>
  <//>`;
}

/* ===== דף משימה ===== */
function TaskPage({ task, stops, people, couriers, onBack, initialTab, mobile }) {
  const c = statsOf(stops); const phase = phaseOf(task, c);
  const [tab, setTab] = useState(initialTab || (phase === "locating" ? "match" : phase === "assigning" ? "assign" : "track"));
  const isActive = task.status === "active" || task.status === "done";
  const steps = [
    { k: "match", t: "התאמה", s: c.unlocated ? `${c.located}/${c.total} עם מיקום` : `כל ${c.total} ממוקמים`, ok: c.unlocated === 0 },
    { k: "assign", t: "חלוקה", s: isActive ? `${c.couriers.length} שליחים · נשלח` : c.assigned ? `${c.assigned}/${c.total} משויכים` : "הצעה לפי אזורים", ok: isActive },
    { k: "track", t: "מעקב", s: isActive ? `${c.delivered}/${c.total} נמסרו` : "אחרי שליחה", ok: phase === "finished" || phase === "done", dis: !isActive },
  ];
  return html`<div className="page">
    <div className="page-head">
      <div style=${{ minWidth: 0 }}>
        <button className="crumb" onClick=${onBack}><${Icon} n="back"/>לוח בקרה</button>
        <h1>${task.eventName}</h1>
        <div className="sub num">#${task.number} · ${dayName(task.date)}, ${fmtDate(task.date)} · ${c.total} הזמנות${task.expected && task.expected !== c.total ? ` (צוינו ${task.expected})` : ""}</div>
      </div>
      <div className="head-actions">
        <span className=${"pill " + phase}>${PHASE_LABEL[phase]}</span>
        ${phase === "finished" && html`<button className="b b-sec b-sm" onClick=${() => Repo.updateTask(task.id, { status: "done", closedAt: Date.now() }).then(() => toast("המשימה נסגרה"))}>סגור משימה</button>`}
        <${ConfirmButton} className="b b-danger b-sm" label="מחק" confirmLabel="לחץ שוב למחיקה" icon="trash"
          onConfirm=${async () => { await Repo.deleteTask(task.id, stops.map(s => s.id)); toast("המשימה נמחקה"); onBack(); }}/>
      </div>
    </div>
    <div className="steps" role="tablist">
      ${steps.map((s, i) => html`<button key=${s.k} role="tab" className=${"step" + (s.ok ? " ok" : "")} aria-selected=${tab === s.k} disabled=${s.dis} onClick=${() => setTab(s.k)}>
        <span className="sn">${s.ok ? html`<${Icon} n="check" w=${2.6}/>` : i + 1}</span><span style=${{ minWidth: 0 }}><b>${s.t}</b><span className="s num">${s.s}</span></span></button>`)}
    </div>
    ${tab === "match" && html`<${MatchTab} task=${task} stops=${stops} people=${people} c=${c} onNext=${() => setTab("assign")} isActive=${isActive} mobile=${mobile}/>`}
    ${tab === "assign" && html`<${AssignTab} task=${task} stops=${stops} couriers=${couriers} c=${c} onGoMatch=${() => setTab("match")} onDispatched=${() => setTab("track")} isActive=${isActive}/>`}
    ${tab === "track" && html`<${TrackTab} task=${task} stops=${stops} couriers=${couriers} c=${c} mobile=${mobile}/>`}
  </div>`;
}

function MatchTab({ task, stops, people, c, onNext, isActive, mobile }) {
  const pmap = useMemo(() => Object.fromEntries(people.map(p => [p.id, p])), [people]);
  const [f, setF] = useState("all");
  const [locate, setLocate] = useState(null), [linkFor, setLinkFor] = useState(null);
  const kind = s => s.lat != null ? "ok" : s.match === "ambiguous" ? "warn" : "bad";
  const counts = { ok: 0, warn: 0, bad: 0 }; stops.forEach(s => counts[kind(s)]++);
  const order = { bad: 0, warn: 1, ok: 2 };
  const sorted = stops.slice().sort((a, b) => order[kind(a)] - order[kind(b)] || a.seq - b.seq);
  const shown = f === "all" ? sorted : sorted.filter(s => kind(s) === f);
  const pick = async (s, p) => { await Repo.updateStop(s.id, { ...linkFields(p, s), manual: true }); toast(`${s.firstName} ${s.lastName} → ${p.address}`); };
  const unlink = s => Repo.updateStop(s.id, { personId: null, lat: null, lng: null, match: s.candidates && s.candidates.length ? "ambiguous" : "unmatched", area: s.listArea || "", address: s.listAddress || "", desc: "", manual: false });
  const sums = [["all", "כל המוזמנים", stops.length, "all", "users"], ["ok", "יש מיקום", counts.ok, "ok", "check"], ["warn", "בחירה ידנית", counts.warn, "warn", "alert"], ["bad", "דורשים מיקום", counts.bad, "bad", "pin"]];

  const stateBlock = s => { const k = kind(s); const p = s.personId && pmap[s.personId]; return html`
    ${k === "ok" && html`<div className="mstate ok"><${Icon} n="check" w=${2.4}/><div>${s.manual ? "שויך ידנית" : "נמצא במאגר"} · יש מיקום<small>${s.address}${s.area ? " · " + s.area : ""}${!p && s.personId ? " (הרשומה נמחקה מהמאגר)" : ""}</small></div></div>`}
    ${k === "warn" && html`<div className="mstate warn"><${Icon} n="alert"/><div>${s.fuzzy ? "נמצא שם דומה במאגר. זה הוא?" : `נמצאו ${s.candidates.length} אנשים בשם הזה`}<small>בחר את האדם הנכון</small></div></div>
      <div className="cands">${s.candidates.map(id => pmap[id]).filter(Boolean).map(p2 => html`<button key=${p2.id} className="cand" onClick=${() => pick(s, p2)}>
        <span className="cn"><b>${fullName(p2)}</b><small>${p2.address} · ${p2.area}</small></span><span className="go">זה הוא</span></button>`)}</div>`}
    ${k === "bad" && html`<div className="mstate bad"><${Icon} n="pin"/><div>לא נמצא במאגר<small>צריך לסמן את הבית על המפה</small></div></div>`}`; };
  const actions = s => { const k = kind(s); return k !== "ok"
    ? html`<div className="row-actions"><button className="b b-primary b-sm" onClick=${() => setLocate(s)}><${Icon} n="pin"/>${k === "warn" ? "אדם חדש" : "מקם על המפה"}</button>
        <button className="b b-sec b-sm" onClick=${() => setLinkFor(s)}><${Icon} n="link"/>חפש במאגר</button></div>`
    : html`<div className=${"row-actions" + (isActive ? " one" : "")}><button className="b b-ghost b-sm" onClick=${() => setLinkFor(s)}>שנה שיוך</button>
        ${!isActive && html`<button className="b b-ghost b-sm" onClick=${() => unlink(s)}>בטל התאמה</button>`}</div>`; };

  return html`<div className="page" style=${{ gap: "14px" }}>
    <div className="summary">${sums.map(([k, l, n, cls, ic]) => html`<button key=${k} className="sum" aria-pressed=${f === k} onClick=${() => setF(k)}>
      <span className=${"ic " + cls}><${Icon} n=${ic}/></span><span className="t"><b className="num">${n}</b><span className="l">${l}</span></span></button>`)}</div>
    ${c.unlocated === 0 && !isActive && html`<div className="banner ok"><${Icon} n="check"/><span className="grow"><b>לכל המוזמנים יש מיקום.</b> אפשר לעבור לחלוקה בין השליחים.</span><button className="b b-ok b-sm" onClick=${onNext}>המשך לחלוקה</button></div>`}
    ${mobile ? html`<div className="cards">
        ${shown.map(s => { const k = kind(s); return html`<div key=${s.id} className="tcard">
          <div className="tcard-top"><div className="t"><b>${s.firstName} ${s.lastName}</b><span className="s num">#${s.seq}${s.phone ? ` · ${s.phone}` : ""}</span></div></div>
          ${(s.listArea || s.listAddress) && html`<div className="lbl">מהרשימה: ${[s.listArea, s.listAddress].filter(Boolean).join(" · ")}</div>`}
          ${stateBlock(s)}
          ${actions(s)}
        </div>`; })}
        ${shown.length === 0 && html`<div className="panel empty-note">אין מוזמנים בקטגוריה הזו</div>`}
      </div>` : html`<section className="panel"><div className="tbl-wrap"><table className="tbl">
      <thead><tr><th>#</th><th>מוזמן</th><th>מהרשימה של הלקוח</th><th>התאמה במאגר</th><th>פעולה</th></tr></thead>
      <tbody>${shown.map(s => html`<tr key=${s.id}>
          <td className="n muted">${s.seq}</td>
          <td><div className="t-name">${s.firstName} ${s.lastName}</div>${s.phone && html`<div className="t-sub num">${s.phone}</div>`}</td>
          <td className="muted">${[s.listArea, s.listAddress].filter(Boolean).join(" · ") || "—"}</td>
          <td style=${{ minWidth: "260px" }}><div className="stack" style=${{ gap: "8px" }}>${stateBlock(s)}</div></td>
          <td style=${{ minWidth: "250px" }}>${actions(s)}</td>
        </tr>`)}</tbody></table></div>
      ${shown.length === 0 && html`<div className="empty-note">אין מוזמנים בקטגוריה הזו</div>`}
    </section>`}
    ${locate && html`<${LocateModal} stop=${locate} people=${people} onClose=${() => setLocate(null)}/>`}
    ${linkFor && html`<${LinkModal} stop=${linkFor} people=${people} onClose=${() => setLinkFor(null)}/>`}
  </div>`;
}

function AssignTab({ task, stops, couriers, c, onGoMatch, onDispatched, isActive }) {
  const cmap = useCourierMap(couriers);
  const [sel, setSel] = useState(() => c.couriers.length ? c.couriers : couriers.slice(0, 2).map(x => x.id));
  const [hi, setHi] = useState(null), [busy, setBusy] = useState(false), [fitKey, setFitKey] = useState(1);
  const located = stops.filter(s => s.lat != null);
  const colIds = [...new Set([...sel, ...c.couriers])].filter(id => cmap[id]);
  const unassigned = located.filter(s => !s.courierId || !cmap[s.courierId]);
  const toggle = id => setSel(s => s.includes(id) ? s.filter(x => x !== id) : [...s, id]);
  const suggest = async () => {
    if (!sel.length) return;
    const plan = suggestSplit(located, couriers.filter(x => sel.includes(x.id)).map(x => x.id));
    const list = Object.entries(plan).filter(([id, p]) => { const s = stops.find(x => x.id === id); return s.courierId !== p.courierId || s.route !== p.route; }).map(([id, patch]) => ({ id, patch }));
    setBusy(true); await Repo.updateStops(list).catch(() => { }); setBusy(false); setFitKey(k => k + 1);
    toast(`הוצעה חלוקה ל-${sel.length} שליחים לפי אזורים`);
  };
  const reassign = async (s, cid) => {
    const max = Math.max(0, ...stops.filter(x => x.courierId === cid).map(x => x.route || 0));
    await Repo.updateStop(s.id, { courierId: cid || null, route: cid ? max + 1 : null });
    if (cid && !sel.includes(cid)) setSel(v => [...v, cid]);
    if (isActive) toast(`${s.firstName} ${s.lastName} הועבר ל${cid ? cmap[cid].name : "ללא שליח"}`);
  };
  const dispatch = async () => {
    setBusy(true);
    const patches = []; const groups = groupBy(stops.filter(s => s.courierId), "courierId");
    Object.values(groups).forEach(g => routeOrder(g).forEach((s, i) => { if (s.route !== i + 1) patches.push({ id: s.id, patch: { route: i + 1 } }); }));
    try { await Repo.updateStops(patches); await Repo.updateTask(task.id, { status: "active", activatedAt: Date.now() }); toast("נשלח. כל שליח רואה עכשיו רק את המוזמנים שלו."); onDispatched(); }
    catch (e) { } setBusy(false);
  };
  const points = useMemo(() => located.map(s => {
    const cr = cmap[s.courierId]; const on = hi === s.id;
    return { id: s.id, lat: s.lat, lng: s.lng, size: on ? 32 : 24, z: on ? 1000 : 0, title: `${s.firstName} ${s.lastName}`, html: mk(cr ? cr.color : "#6F7F89", s.route && cr ? s.route : "", on ? "sel" : "") };
  }), [stops, couriers, hi]);
  if (c.unlocated > 0) return html`<div className="banner warn"><${Icon} n="alert"/><span className="grow"><b>ל-${c.unlocated} מוזמנים עדיין אין מיקום.</b> צריך להשלים את שלב ההתאמה לפני החלוקה.</span><button className="b b-sec b-sm" onClick=${onGoMatch}>לשלב ההתאמה</button></div>`;
  const listRow = s => html`<div key=${s.id} className=${"arow" + (hi === s.id ? " hi" : "")} onClick=${() => setHi(s.id)} id=${"ar-" + s.id}>
    <span className="rn num" style=${{ background: cmap[s.courierId] ? cmap[s.courierId].color : "#6F7F89" }}>${s.route || "–"}</span>
    <span className="an"><b>${s.firstName} ${s.lastName}</b><small>${s.address} · ${s.area}</small></span>
    <select className="sel" aria-label=${`שליח עבור ${s.firstName} ${s.lastName}`} value=${s.courierId || ""} onClick=${e => e.stopPropagation()} onChange=${e => reassign(s, e.target.value)}>
      <option value="">ללא שליח</option>${couriers.map(x => html`<option key=${x.id} value=${x.id}>${x.name}</option>`)}</select></div>`;
  return html`<div className="page" style=${{ gap: "14px" }}>
    <section className="panel"><div className="panel-body stack">
      <span className="lbl">שליחים למשימה</span>
      <div className="a-chips">${couriers.map(x => html`<button key=${x.id} className="a-chip" aria-pressed=${sel.includes(x.id)} onClick=${() => toggle(x.id)}><i style=${{ background: x.color }}></i>${x.name}</button>`)}</div>
      <div className="row-actions stack-m" style=${isActive ? { gridTemplateColumns: "1fr" } : null}>
        <button className="b b-sec" disabled=${!sel.length || busy} onClick=${suggest}><${Icon} n="map"/>הצע חלוקה לפי אזורים</button>
        ${!isActive && html`<button className="b b-primary" disabled=${busy || unassigned.length > 0 || !located.length} onClick=${dispatch}><${Icon} n="truck"/>שלח לשליחים</button>`}
      </div>
    </div></section>
    ${isActive ? html`<div className="banner info"><${Icon} n="refresh"/><span className="grow">המשימה פעילה. כל שינוי שיוך כאן מופיע אצל השליח מיד.</span></div>`
      : unassigned.length > 0 && html`<div className="banner warn"><${Icon} n="alert"/><span className="grow">${unassigned.length} מוזמנים עדיין בלי שליח. לחץ "הצע חלוקה לפי אזורים" או בחר שליח בכל שורה.</span></div>`}
    <div className="split">
      <${LMap} className="map-m" points=${points} fitKey=${fitKey} onMarkerClick=${id => { setHi(id); const el = document.getElementById("ar-" + id); el && el.scrollIntoView({ block: "nearest", behavior: "smooth" }); }}/>
      <div className="cols">
        ${colIds.map(id => { const list = located.filter(s => s.courierId === id).sort((a, b) => (a.route || 0) - (b.route || 0)); const areas = [...new Set(list.map(s => s.area).filter(Boolean))];
          return html`<div key=${id} className="ccol"><div className="ccol-head"><i style=${{ background: cmap[id].color }}></i><b>${cmap[id].name}</b><span className="s">${areas.join(" · ") || "אין מוזמנים"}</span><span className="pill pending num">${list.length}</span></div>
            <div className="ccol-list">${list.map(listRow)}</div></div>`; })}
        ${unassigned.length > 0 && html`<div className="ccol"><div className="ccol-head"><i style=${{ background: "#6F7F89" }}></i><b>ללא שליח</b><span className="s"></span><span className="pill pending num">${unassigned.length}</span></div>
          <div className="ccol-list">${unassigned.map(listRow)}</div></div>`}
      </div>
    </div>
  </div>`;
}

function TrackTab({ task, stops, couriers, c, mobile }) {
  const cmap = useCourierMap(couriers);
  const [f, setF] = useState("all"), [cf, setCf] = useState(""), [hi, setHi] = useState(null);
  const [now, setNow] = useState(Date.now());
  useEffect(() => { const t = setInterval(() => setNow(Date.now()), 3000); return () => clearInterval(t); }, []);
  const byC = groupBy(stops.filter(s => s.courierId), "courierId");
  const cids = Object.keys(byC).filter(id => cmap[id]);
  const shown = stops.filter(s => (f === "all" || s.status === f) && (!cf || s.courierId === cf))
    .sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0) || (a.courierId || "").localeCompare(b.courierId || "") || (a.route || 0) - (b.route || 0));
  const points = useMemo(() => stops.filter(s => s.lat != null && (!cf || s.courierId === cf)).map(s => {
    const cr = cmap[s.courierId]; const on = hi === s.id;
    return { id: s.id, lat: s.lat, lng: s.lng, size: on ? 32 : 24, z: on ? 1000 : s.status === "pending" ? 0 : 100, title: `${s.firstName} ${s.lastName} · ${STATUS_LABEL[s.status]}`,
      html: `<div class="mk ring ${on ? "sel" : ""}" style="background:${STATUS_COLOR[s.status]};border-color:${cr ? cr.color : "#fff"}">${s.status === "delivered" ? "✓" : s.route || ""}</div>` };
  }), [stops, couriers, cf, hi]);
  const filters = [["all", "הכל", c.total], ["pending", "ממתין", c.pending], ["delivered", "נמסר", c.delivered], ["retry", "ניסיון נוסף", c.retry], ["failed", "בעיה", c.failed]];
  const fresh = s => s.updatedAt && now - s.updatedAt < 6000;
  const filterBar = html`<div className="stack" style=${{ gap: "10px" }}>
    <div className="a-chips scroll">${filters.map(([k, l, n]) => html`<button key=${k} className="a-chip num" aria-pressed=${f === k} onClick=${() => setF(k)}>${l} · ${n}</button>`)}</div>
    ${cids.length > 1 && html`<div className="a-chips scroll"><button className="a-chip" aria-pressed=${!cf} onClick=${() => setCf("")}>כל השליחים</button>
      ${cids.map(id => html`<button key=${id} className="a-chip" aria-pressed=${cf === id} onClick=${() => setCf(cf === id ? "" : id)}><i style=${{ background: cmap[id].color }}></i>${cmap[id].name}</button>`)}</div>`}
  </div>`;
  const map = html`<${LMap} className="map-m" points=${points} fitKey=${cf || "all"} onMarkerClick=${setHi}/>`;
  return html`<div className="page" style=${{ gap: "14px" }}>
    <div className="cprog">${cids.map(id => { const cc = statsOf(byC[id]); const last = Math.max(0, ...byC[id].map(s => s.updatedAt || 0));
      return html`<div key=${id} className="cp"><div className="cp-head"><i style=${{ background: cmap[id].color }}></i><b>${cmap[id].name}</b><span className="cp-num num">${cc.delivered}<small>/${cc.total}</small></span></div>
        <${StatusBar} c=${cc}/><span className="s num">${cc.open} פתוחים${cc.retry ? ` · ${cc.retry} ניסיון נוסף` : ""}${cc.failed ? ` · ${cc.failed} בעיה` : ""}${last ? ` · ${hhmm(last)}` : ""}</span></div>`; })}</div>
    ${mobile ? html`
      ${map}
      ${filterBar}
      <div className="panel">
        ${shown.map(s => html`<div key=${s.id} className=${"trow" + (fresh(s) ? " flash" : "")} onClick=${() => setHi(s.id)}>
          <${SBadge} s=${s.status} iconOnly/>
          <span className="m"><b>${s.firstName} ${s.lastName}</b><span>${STATUS_LABEL[s.status]}${s.reason ? ` · ${REASON_LABEL[s.reason]}` : ""}${s.note ? ` · ${s.note}` : ""}${s.updatedAt ? ` · ${hhmm(s.updatedAt)}` : ""}</span></span>
          <${CDot} c=${cmap[s.courierId]}/>
        </div>`)}
        ${shown.length === 0 && html`<div className="empty-note">אין מוזמנים בסינון הזה</div>`}
      </div>` : html`
      <div className="split">
        <section className="panel">
          <div className="panel-body">${filterBar}</div>
          <div className="tbl-wrap" style=${{ maxHeight: "520px", overflowY: "auto", borderTop: "1px solid var(--line)" }}><table className="tbl">
            <thead><tr><th>מוזמן</th><th>שליח</th><th>סטטוס</th><th>סיבה</th><th>עודכן</th></tr></thead>
            <tbody>${shown.map(s => html`<tr key=${s.id} className=${(hi === s.id ? "hi " : "") + (fresh(s) ? "flash" : "")} onMouseEnter=${() => setHi(s.id)}>
              <td><div className="t-name">${s.firstName} ${s.lastName}</div><div className="t-sub">${s.address}</div></td>
              <td><${CDot} c=${cmap[s.courierId]}/></td>
              <td><${SBadge} s=${s.status}/></td>
              <td className="muted">${s.reason ? REASON_LABEL[s.reason] : ""}${s.note ? ` · ${s.note}` : ""}</td>
              <td className="n muted">${s.updatedAt ? hhmm(s.updatedAt) : ""}</td></tr>`)}</tbody></table>
            ${shown.length === 0 && html`<div className="empty-note">אין מוזמנים בסינון הזה</div>`}</div>
        </section>
        ${map}
      </div>`}
  </div>`;
}

/* ===== מאגר אנשים ===== */
function PeoplePage({ people, stops, tasks, mobile }) {
  const [q, setQ] = useState("");
  const [edit, setEdit] = useState(null);
  const [draft, setDraft] = useState(null);
  const [saving, setSaving] = useState(false), [error, setError] = useState(null);
  const [view, setView] = useState("list");
  const [focus, setFocus] = useState(null);
  const list = useMemo(() => { const n = norm(q); return people.filter(p => !n || norm(fullName(p)).includes(n) || norm(p.lastName).includes(n) || norm(p.address).includes(n))
    .sort((a, b) => a.lastName.localeCompare(b.lastName, "he") || a.firstName.localeCompare(b.firstName, "he")); }, [people, q]);
  const open = p => { setEdit(p.id); setDraft({ ...p }); setError(null); if (p.lat != null) setFocus({ lat: p.lat, lng: p.lng, key: p.id + Date.now() }); };
  const openNew = () => { setEdit("new"); setDraft({ firstName: "", lastName: "", phone: "", area: "", address: "", notes: "", lat: null, lng: null }); setError(null); };
  const close = () => { setEdit(null); setDraft(null); setError(null); };
  const openTaskIds = new Set(tasks.filter(t => t.status !== "done").map(t => t.id));
  const save = async () => {
    const err = validatePerson(draft); if (err) { setError(err); return; }
    setSaving(true);
    try {
      if (edit === "new") { const p = { ...draft, id: uid("p"), createdAt: Date.now() }; await Repo.savePerson(p); toast(`${fullName(p)} נוסף למאגר`); open(p); }
      else {
        await Repo.savePerson(draft);
        const linked = stops.filter(s => s.personId === draft.id && openTaskIds.has(s.taskId));
        if (linked.length) await Repo.updateStops(linked.map(s => ({ id: s.id, patch: { lat: draft.lat, lng: draft.lng, address: draft.address || "", area: draft.area || "", desc: draft.notes || "" } })));
        toast(linked.length ? `נשמר · עודכן גם ב-${linked.length} משימות פתוחות` : "השינויים נשמרו");
      }
    } catch (e) { }
    setSaving(false);
  };
  const del = async () => { await Repo.deletePerson(draft.id); toast(`${fullName(draft)} נמחק מהמאגר`); close(); };
  const points = useMemo(() => {
    const base = people.filter(p => p.lat != null && p.id !== edit).map(p => ({ id: p.id, lat: p.lat, lng: p.lng, size: 16, html: mk("#16324B", "", edit ? "faint" : ""), title: fullName(p) }));
    if (draft && draft.lat != null) base.push({ id: "__edit", lat: draft.lat, lng: draft.lng, size: 32, z: 1000, draggable: true, noFit: true, html: mk("#2563D9", "", "new") });
    return base;
  }, [people, edit, draft && draft.lat, draft && draft.lng]);
  const linkedCount = draft && draft.id ? stops.filter(s => s.personId === draft.id).length : 0;
  const showMap = !mobile || !!draft || view === "map";
  const mapEl = html`<div className="ppl-map" hidden=${!showMap}>
    <${LMap} points=${points} fitKey=${1} focus=${focus} placing=${!!draft}
      hint=${draft ? (draft.lat == null ? "לחץ על המפה כדי לקבוע את מיקום הבית" : "גרור את הנקודה כדי לדייק") : null}
      onMapClick=${ll => { if (draft) { setDraft(d => ({ ...d, ...ll })); setError(null); } }}
      onMarkerClick=${id => { if (id === "__edit") return; const p = people.find(x => x.id === id); if (p && !draft) open(p); }}
      onMarkerDrag=${(id, ll) => id === "__edit" && setDraft(d => ({ ...d, ...ll }))}/>
  </div>`;
  return html`<div className="page">
    <div className="page-head">
      <div><h1>מאגר אנשים</h1><div className="sub"><${Icon} n="shield"/> גלוי למנהל בלבד. שליחים לא רואים את המאגר.</div></div>
      ${!draft && html`<button className="b b-primary" onClick=${openNew}><${Icon} n="plus"/>הוסף אדם</button>`}
    </div>
    ${mobile && !draft && html`<div className="seg full" role="tablist"><button role="tab" aria-selected=${view === "list"} onClick=${() => setView("list")}><${Icon} n="list"/>רשימה</button>
      <button role="tab" aria-selected=${view === "map"} onClick=${() => setView("map")}><${Icon} n="map"/>מפה</button></div>`}
    <div className="ppl">
      ${mobile && draft && mapEl}
      <section className="panel ppl-side" hidden=${mobile && !draft && view === "map"}>
        ${draft ? html`<div className="panel-head"><h2>${edit === "new" ? "אדם חדש" : fullName(draft) || "עריכה"}</h2><button className="b b-ghost b-sm" onClick=${close}>חזרה לרשימה</button></div>
          <div className="panel-body" style=${{ overflowY: "auto" }}>
            <${PersonForm} draft=${draft} setDraft=${setDraft} isNew=${edit === "new"} saving=${saving} error=${error} onSave=${save} onCancel=${close} onDelete=${edit !== "new" ? del : null}
              extra=${linkedCount ? html`<div className="lbl">מופיע ב-${linkedCount} עצירות חלוקה</div>` : null}/>
          </div>` : html`
          <div className="panel-body" style=${{ paddingBottom: "10px" }}><div className="search"><${Icon} n="search"/><input id="ppl-q" type="search" value=${q} placeholder="חיפוש לפי שם, משפחה או כתובת" onChange=${e => setQ(e.target.value)}/></div>
            <div className="lbl num" style=${{ marginTop: "8px" }}>${list.length} מתוך ${people.length} רשומות</div></div>
          <div className="ppl-list">${list.map(p => html`<button key=${p.id} className="prow" onClick=${() => open(p)}>
            <span className="av">${p.firstName[0]}</span><span className="pm"><b>${fullName(p)}</b><small>${p.address}${p.area ? " · " + p.area : ""}</small></span>
            ${p.lat == null ? html`<span className="pill locating">ללא מיקום</span>` : html`<${Icon} n="next"/>`}</button>`)}
            ${list.length === 0 && html`<div className="empty-note">לא נמצא אף אחד בשם הזה</div>`}</div>`}
      </section>
      ${!(mobile && draft) && mapEl}
    </div>
  </div>`;
}

/* ===== מעטפת המנהל ===== */
function AdminApp({ onExit }) {
  const people = useCollection("people"), tasks = useCollection("tasks"), stops = useCollection("stops"), couriers = useCollection("couriers");
  const mobile = useIsMobile();
  const [route, setRoute] = useState({ page: "dash" });
  const [newOpen, setNewOpen] = useState(false);
  const [menu, setMenu] = useState(false);
  const [resetting, setResetting] = useState(null);
  const mainRef = useRef(null);
  const go = r => { setRoute(r); mainRef.current && mainRef.current.scrollTo({ top: 0 }); };
  const loaded = people && tasks && stops && couriers;
  const reset = async () => { setMenu(false); setResetting("0"); try { await STORE.reset((d, t) => setResetting(`${d}/${t}`)); toast("נתוני הדמה שוחזרו"); go({ page: "dash" }); } catch (e) { toast("האיפוס לא הושלם. נסה שוב.", "error"); } setResetting(null); };
  const task = route.page === "task" && tasks ? tasks.find(t => t.id === route.id) : null;
  let body;
  if (!loaded) body = html`<div className="empty-note">טוען נתונים…</div>`;
  else if (!people.length && !tasks.length) body = html`<div className="page"><section className="panel"><div className="empty-note stack" style=${{ alignItems: "center" }}>
      <b style=${{ fontSize: "18px", color: "var(--ink)" }}>המאגר ריק</b><span>אפשר לטעון את נתוני הדמה: כפר לדוגמה, 46 אנשים, 3 שליחים ושתי משימות.</span>
      <button className="b b-primary" onClick=${reset} disabled=${!!resetting}>${resetting ? `טוען… ${resetting}` : "טען נתוני דמה"}</button></div></section></div>`;
  else if (route.page === "people") body = html`<${HousesPage} people=${people} stops=${stops} tasks=${tasks} mobile=${mobile}/>`;
  else if (route.page === "task" && task) body = html`<${TaskPage} key=${task.id} task=${task} stops=${stops.filter(s => s.taskId === task.id)} people=${people} couriers=${couriers} initialTab=${route.tab} mobile=${mobile} onBack=${() => go({ page: "dash" })}/>`;
  else body = html`<${Dashboard} tasks=${tasks} stops=${stops} couriers=${couriers} go=${go} onNew=${() => setNewOpen(true)} mobile=${mobile}/>`;
  const cur = k => route.page === k || (k === "dash" && route.page === "task") ? "page" : null;
  const modeText = MODE_TEXT[STORE.mode];
  const logout = async () => { try { await CLOUD.client.auth.signOut(); } catch (e) { } location.reload(); };
  return html`<div className="adm">
    <aside className="side">
      <div className="side-brand"><span className="logo"><${Icon} n="mail"/></span><span><b>חלוקת הזמנות</b><small>ממשק מנהל</small></span></div>
      <button className="nav-btn" aria-current=${cur("dash")} onClick=${() => go({ page: "dash" })}><${Icon} n="dash"/>לוח בקרה</button>
      <button className="nav-btn" aria-current=${cur("people")} onClick=${() => go({ page: "people" })}><${Icon} n="map"/>מפת בתים</button>
      <div className="side-foot">
        <span className=${"mode-dot " + (STORE.mode === "local" ? "local" : "")}><i></i>${modeText}</span>
        <${ConfirmButton} className="nav-btn" label=${resetting ? `משחזר… ${resetting}` : "איפוס נתוני דמה"} confirmLabel="לחץ שוב לאיפוס" icon="refresh" onConfirm=${reset}/>
        <button className="nav-btn" onClick=${onExit}><${Icon} n="users"/>החלפת משתמש</button>
        ${STORE.mode === "cloud" && html`<button className="nav-btn" onClick=${logout}><${Icon} n="logout"/>התנתק</button>`}
      </div>
    </aside>
    <header className="m-top">
      <span className="logo"><${Icon} n="mail"/></span><b>חלוקת הזמנות</b>
      <button className="c-icon" onClick=${() => setMenu(true)} aria-label="תפריט"><${Icon} n="more"/></button>
    </header>
    <main className=${"main" + (route.page === "people" && loaded && (people.length || tasks.length) ? " flush" : "")} ref=${mainRef}>${body}</main>
    <nav className="m-nav" aria-label="ניווט ראשי">
      <button aria-current=${cur("dash")} onClick=${() => go({ page: "dash" })}><${Icon} n="dash"/>לוח בקרה</button>
      <button onClick=${() => loaded && setNewOpen(true)} aria-label="משימת חלוקה חדשה"><span className="plus"><${Icon} n="plus"/></span>משימה חדשה</button>
      <button aria-current=${cur("people")} onClick=${() => go({ page: "people" })}><${Icon} n="map"/>מפת בתים</button>
    </nav>
    ${menu && html`<div className="scrim" onClick=${e => { if (e.target === e.currentTarget) setMenu(false); }}>
      <div className="sheet" role="dialog" aria-modal="true" aria-label="תפריט">
        <div className="grab"></div><h3>תפריט</h3>
        <span className=${"mode-dot " + (STORE.mode === "local" ? "local" : "")}><i></i>${modeText}</span>
        <${ConfirmButton} className="menu-item" label=${resetting ? `משחזר… ${resetting}` : "איפוס נתוני דמה"} confirmLabel="לחץ שוב לאיפוס" icon="refresh" onConfirm=${reset}/>
        <button className="menu-item" onClick=${onExit}><span>החלפת משתמש</span><${Icon} n="users"/></button>
        ${STORE.mode === "cloud" && html`<button className="menu-item" onClick=${logout}><span>התנתק מהחשבון</span><${Icon} n="logout"/></button>`}
        <button className="sheet-ghost" onClick=${() => setMenu(false)}>סגור</button>
      </div></div>`}
    ${newOpen && loaded && html`<${NewTaskModal} people=${people} tasks=${tasks} onClose=${() => setNewOpen(false)} onCreated=${id => { setNewOpen(false); go({ page: "task", id, tab: "match" }); }}/>`}
    <${ToastHost}/>
  </div>`;
}

/* ===== בחירת משתמש (במקום התחברות, לצורך ההדגמה) ===== */
function RolePicker({ go }) {
  const couriers = useCollection("couriers");
  return html`<div className="pick"><div className="pick-box">
    <span className="pick-logo"><${Icon} n="mail"/></span>
    <div className="pick-brand">חלוקת הזמנות<small>בחר איך להיכנס. בגרסת ההדגמה אין סיסמאות.</small></div>
    <div className="pick-group"><span className="pick-label">מנהל</span>
      <button className="pick-btn" onClick=${() => go("admin")}><span className="pick-ic" style=${{ background: "#16324B" }}><${Icon} n="dash"/></span>
        <span className="t"><b>ממשק מנהל</b><span className="s">משימות, מאגר אנשים, חלוקה ומעקב</span></span><span className="chev"><${Icon} n="next"/></span></button></div>
    <div className="pick-group"><span className="pick-label">שליחים</span>
      ${(couriers || []).map(c => html`<button key=${c.id} className="pick-btn" onClick=${() => go(c.id)}><span className="pick-ic" style=${{ background: c.color }}>${c.name[0]}</span>
        <span className="t"><b>${c.name}</b><span className="s">רואה רק את היעדים שהוקצו לו</span></span><span className="chev"><${Icon} n="next"/></span></button>`)}
      ${couriers && !couriers.length && html`<p className="pick-note">אין עדיין שליחים. היכנס כמנהל וטען את נתוני הדמה.</p>`}</div>
    <span className=${"mode-dot " + (STORE.mode === "local" ? "local" : "")}><i></i>${PICK_MODE_TEXT[STORE.mode]}</span>
    ${!inClaude() && html`<button className="pick-btn" onClick=${() => go("sync")}><span className="pick-ic" style=${{ background: "#15804D" }}><${Icon} n="refresh"/></span>
      <span className="t"><b>סנכרון בין מכשירים</b><span className="s">${STORE.mode === "cloud" ? "מחובר ל-Supabase" : "חיבור ל-Supabase כדי לעבוד מהמחשב ומהטלפון"}</span></span><span className="chev"><${Icon} n="next"/></span></button>`}
    <p className="pick-note">כל השמות, הכתובות והטלפונים הם נתוני דמה.</p>
  </div></div>`;
}

const MODE_TEXT = { local: "מצב מקומי: הנתונים נשמרים בדפדפן הזה בלבד", shared: "מסונכרן בין מכשירים", cloud: "מסונכרן בין מכשירים (Supabase)" };
const PICK_MODE_TEXT = {
  local: "מצב מקומי: הנתונים נשמרים בדפדפן הזה בלבד. כדי לעבוד גם מהמחשב וגם מהטלפון, חבר סנכרון.",
  shared: "מסונכרן: פתח את אותו קישור במחשב כמנהל ובטלפון כשליח.",
  cloud: "מסונכרן דרך Supabase: אותם נתונים בכל מכשיר שמחובר לחשבון.",
};

/* ===== חיבור Supabase: הגדרה והתחברות ===== */
function SyncSettings({ onBack }) {
  const cur = cloudConfig() || { url: "", key: "" };
  const [url, setUrl] = useState(cur.url), [key, setKey] = useState(cur.key), [err, setErr] = useState(null);
  const save = e => {
    e.preventDefault();
    const u = url.trim().replace(/\/+$/, "");
    if (!/^https:\/\/[\w-]+\.supabase\.co$/.test(u)) { setErr("כתובת הפרויקט צריכה להיראות כך: https://xxxx.supabase.co"); return; }
    if (key.trim().length < 30) { setErr("המפתח קצר מדי. העתק את ה-anon public key מהגדרות ה-API של הפרויקט."); return; }
    setCloudConfig({ url: u, key: key.trim() }); location.hash = ""; location.reload();
  };
  const disconnect = () => { setCloudConfig(null); try { Object.keys(localStorage).filter(k => k.startsWith("sb-")).forEach(k => localStorage.removeItem(k)); } catch (e) { } location.hash = ""; location.reload(); };
  return html`<div className="pick"><form className="pick-box" onSubmit=${save}>
    <button type="button" className="crumb" onClick=${onBack}><${Icon} n="back"/>חזרה</button>
    <div className="pick-brand">סנכרון בין מכשירים<small>מחברים פעם אחת בכל מכשיר. אחרי ההתחברות, מה ששומרים בטלפון מופיע במחשב, ולהפך.</small></div>
    <div className="f"><label for="s-url">כתובת הפרויקט (Project URL)</label><input id="s-url" dir="ltr" inputMode="url" autoComplete="off" placeholder="https://xxxx.supabase.co" value=${url} onChange=${e => setUrl(e.target.value)}/></div>
    <div className="f"><label for="s-key">מפתח ציבורי (anon public key)</label><textarea id="s-key" dir="ltr" rows="3" autoComplete="off" value=${key} onChange=${e => setKey(e.target.value)}></textarea></div>
    ${err && html`<div className="err">${err}</div>`}
    <button className="b b-primary b-lg" type="submit">שמור והתחבר</button>
    ${cloudConfig() && html`<${ConfirmButton} className="b b-danger" label="נתק את הסנכרון במכשיר הזה" confirmLabel="לחץ שוב לניתוק" onConfirm=${disconnect}/>`}
    <p className="pick-note">הפרטים נשמרים רק בדפדפן של המכשיר הזה. המפתח הציבורי לבדו לא נותן גישה לנתונים: צריך גם להתחבר עם המשתמש שהגדרת ב-Supabase.</p>
  </form></div>`;
}
function LoginScreen({ client, onDone }) {
  const [email, setEmail] = useState(""), [pw, setPw] = useState(""), [err, setErr] = useState(null), [busy, setBusy] = useState(false);
  const submit = async e => {
    e.preventDefault(); setBusy(true); setErr(null);
    const { error } = await client.auth.signInWithPassword({ email: email.trim(), password: pw });
    setBusy(false);
    if (error) setErr(/invalid/i.test(error.message) ? "האימייל או הסיסמה לא נכונים." : "ההתחברות נכשלה: " + error.message); else onDone();
  };
  const local = () => { setCloudConfig(null); location.reload(); };
  return html`<div className="pick"><form className="pick-box" onSubmit=${submit}>
    <span className="pick-logo"><${Icon} n="mail"/></span>
    <div className="pick-brand">כניסה<small>התחבר עם המשתמש שיצרת ב-Supabase.</small></div>
    <div className="f"><label for="l-email">אימייל</label><input id="l-email" type="email" dir="ltr" autoComplete="username" value=${email} onChange=${e => setEmail(e.target.value)}/></div>
    <div className="f"><label for="l-pw">סיסמה</label><input id="l-pw" type="password" dir="ltr" autoComplete="current-password" value=${pw} onChange=${e => setPw(e.target.value)}/></div>
    ${err && html`<div className="err">${err}</div>`}
    <button className="b b-primary b-lg" type="submit" disabled=${busy || !email || !pw}>${busy ? "מתחבר…" : "התחבר"}</button>
    <${ConfirmButton} className="b b-ghost" label="עבוד בלי סנכרון (מקומי)" confirmLabel="לחץ שוב: הנתונים יישמרו רק במכשיר הזה" onConfirm=${local}/>
  </form></div>`;
}

function Root() {
  const [boot, setBoot] = useState(null);
  const readHash = () => { try { return (location.hash || "").replace(/^#/, ""); } catch (e) { return ""; } };
  const [role, setRole] = useState(readHash);
  useEffect(() => {
    bootStore().then(r => { if (r.store) STORE = r.store; setBoot(r); if (r.cloudError) setTimeout(() => toast("החיבור ל-Supabase נכשל. עובדים במצב מקומי.", "error"), 500); });
    const h = () => setRole(readHash());
    window.addEventListener("hashchange", h); return () => window.removeEventListener("hashchange", h);
  }, []);
  const go = r => { try { location.hash = r; } catch (e) { } setRole(r); };
  if (!boot) return html`<div className="splash">טוען…</div>`;
  if (role === "sync" && !inClaude()) return html`<${SyncSettings} onBack=${() => go("")}/>`;
  if (boot.needLogin) return html`<${LoginScreen} client=${boot.client} onDone=${() => { STORE = createCloudStore(boot.client); setBoot({ store: STORE }); }}/>`;
  if (role === "admin") return html`<${AdminApp} onExit=${() => go("")}/>`;
  if (/^c[\w-]+$/.test(role)) return html`<${CourierApp} courierId=${role} onExit=${() => go("")}/>`;
  return html`<${RolePicker} go=${go}/><${ToastHost}/>`;
}
ReactDOM.createRoot(document.getElementById("root")).render(html`<${Root}/>`);

</script>

</body>
</html>
